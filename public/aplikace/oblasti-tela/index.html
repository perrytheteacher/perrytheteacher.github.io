<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oblasti lidského těla – česky a latinsky</title>
<style>
:root{--ok:#2e7d32;--zle:#c62828;--text:#1f2328;--muted:#5b6470;--line:#d5d9de;--bg:#fafbfc;--modra:#1f6feb}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);max-width:1180px;margin:0 auto;padding:10px;background:#fff;-webkit-user-select:none;user-select:none}
h1{font-size:1.15rem;margin:0 0 4px}
.napoveda{font-size:.85rem;color:var(--muted);margin:0 0 8px;line-height:1.35}
.lista{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;font-size:.85rem;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:var(--text)}
button:hover{background:#f1f3f5}
button.hlavni{background:var(--modra);color:#fff;border-color:var(--modra)}
button.hlavni:hover{background:#1a5fd0}
.zalozky{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-right:6px}
.zalozky .nadpis{font-size:.78rem;color:var(--muted);margin-right:2px}
.zalozka{font-size:.8rem;padding:3px 10px;border-radius:14px}
.zalozka.aktivni{background:#1f2328;color:#fff;border-color:#1f2328}
.stav{font-size:.88rem;min-height:1.4em;margin:2px 0 6px;color:var(--muted)}
.stav b{color:var(--text)}
.dobre{color:var(--ok);font-weight:600}
.zasobnik{border:1px solid var(--line);border-radius:8px;padding:6px;margin-bottom:8px;background:var(--bg);display:flex;flex-wrap:wrap;gap:5px;min-height:42px;align-items:center}
.prazdno{font-size:.85rem;color:var(--muted);padding:4px}
.chip{touch-action:none;cursor:grab;border-radius:6px;padding:3px 8px;font-size:.88rem;font-weight:600;border:1.5px solid #7a8a99;background:#e8eef5;line-height:1.4;white-space:nowrap}
.chip.vybrana{outline:3px solid #f2a900;outline-offset:1px}
.chip.duch{position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-60%);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.telo{display:flex;flex-direction:column;gap:10px}
@media (min-width:900px){.telo{flex-direction:row;align-items:flex-start}.obr{flex:1.25 1 0}.sloty{flex:1 1 0}}
.obr{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;align-self:flex-start;width:100%}
.ram{position:relative;width:100%;margin:0 auto;min-width:240px}
.obr img{display:block;width:100%;height:auto}
.znacka{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#1f2328;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 0 1px #1f2328;cursor:pointer}
.znacka.svit{background:#f2a900;color:#1f2328;box-shadow:0 0 0 3px #f2a900}
.sloty{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;align-content:start;width:100%}
.slot{display:flex;align-items:center;gap:6px;border:1.5px dashed #b8c0c8;border-radius:7px;min-height:34px;padding:3px 5px;background:#fff;cursor:pointer}
.slot .cislo{flex:0 0 22px;height:22px;border-radius:50%;background:#1f2328;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.slot .vlozeno{display:flex;flex-direction:column;gap:1px;min-width:0}
.slot .chip{font-size:.82rem;padding:2px 6px;white-space:normal}
.slot .druhy{font-size:.75rem;color:var(--muted);font-style:italic;padding-left:2px}
.slot.svit{border-color:#f2a900;background:#fff8e1}
.slot.ok{border:1.5px solid var(--ok);background:#ecf7ee}
.slot.spatne{border:1.5px solid var(--zle);background:#fdecec}
.karty{display:flex;gap:4px;margin:0 0 8px;flex-wrap:wrap}
.karta{display:none}.karta.aktivni{display:block}
/* kvíz */
.kviz{max-width:760px}
.otazka{font-size:1.05rem;margin:8px 0 10px;line-height:1.45}
.otazka .mezera{display:inline-block;min-width:90px;border-bottom:2px solid #1f2328;text-align:center;font-weight:700}
.moznosti{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.moznosti button{font-size:.95rem;padding:7px 14px}
.moznosti button.ok{background:#ecf7ee;border-color:var(--ok);color:var(--ok);font-weight:700}
.moznosti button.zle{background:#fdecec;border-color:var(--zle);color:var(--zle)}
.vysvetleni{font-size:.9rem;line-height:1.45;background:var(--bg);border-left:3px solid var(--modra);padding:6px 10px;border-radius:4px;min-height:1em}
.pruh{height:6px;background:#e6e9ed;border-radius:3px;overflow:hidden;margin:6px 0}
.pruh div{height:100%;background:var(--modra);width:0}

</style>
</head>
<body>
<h1>Oblasti lidského těla</h1>
<p class="napoveda">Přední pohled (vlevo) a zadní pohled (vpravo). Pozor: na předním pohledu je pravá strana těla na tvé levé straně. Po kontrole se u správných odpovědí ukáže i druhý jazyk.</p>
<div id="app"></div>
<script>
/* Přiřazovací engine: čísla na obrázku, sloty pod nimi, kartičky s pojmy.
   Ovládání: přetáhni kartičku na slot, nebo klikni na kartičku a pak na slot. */
function vytvorPrirazovani(koren, cfg) {
  const st = { rezim: 'cz', mista: {}, vybrana: null, prvni: null, zkontrolovano: false, poradi: [] };
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const zamichej = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const text = (t, r) => r === 'la' ? t.la : t.cz;
  const druhy = r => r === 'la' ? t => t.cz : t => t.la;

  koren.innerHTML = '';
  const lista = el('div', 'lista');
  const zal = el('div', 'zalozky');
  zal.appendChild(el('span', 'nadpis', 'Pojmy:'));
  const bCz = el('button', 'zalozka aktivni', cfg.rezimy[0]);
  const bLa = el('button', 'zalozka', cfg.rezimy[1]);
  zal.append(bCz, bLa);
  const bKontrola = el('button', 'hlavni', 'Zkontrolovat');
  const bVratit = el('button', '', 'Vrátit chybné');
  const bReseni = el('button', '', 'Ukázat řešení');
  const bNove = el('button', '', 'Nové kolo');
  lista.append(zal, bKontrola, bVratit, bReseni, bNove);
  const stav = el('div', 'stav', '');
  const zasobnik = el('div', 'zasobnik');
  zasobnik.dataset.zasobnik = '1';
  const telo = el('div', 'telo');
  const obr = el('div', 'obr');
  const ram = el('div', 'ram');
  ram.style.maxWidth = 'min(' + (cfg.maxw || 2000) + 'px, calc((100vh - 150px) * ' + (cfg.w / cfg.h).toFixed(4) + '))';
  const img = el('img'); img.src = cfg.obrazek; img.alt = cfg.alt; img.draggable = false;
  ram.appendChild(img); obr.appendChild(ram);
  const sloty = el('div', 'sloty');
  telo.append(obr, sloty);
  koren.append(lista, stav, zasobnik, telo);

  const slotEl = {}, znEl = {};
  cfg.cile.forEach(c => {
    const z = el('div', 'znacka', String(c.n));
    z.style.left = (100 * c.x / cfg.w) + '%'; z.style.top = (100 * c.y / cfg.h) + '%';
    z.addEventListener('click', () => { zvyrazni(c.n); if (st.vybrana) poloz(st.vybrana, c.n); });
    ram.appendChild(z); znEl[c.n] = z;
    const s = el('div', 'slot');
    s.dataset.slot = c.n;
    s.appendChild(el('span', 'cislo', String(c.n)));
    const v = el('span', 'vlozeno'); s.appendChild(v);
    s.addEventListener('click', e => {
      if (st.vybrana) { poloz(st.vybrana, c.n); return; }
      if (st.mista[c.n]) { vratDoZasobniku(c.n); }
      zvyrazni(c.n);
    });
    s.addEventListener('mouseenter', () => zvyrazni(c.n));
    sloty.appendChild(s); slotEl[c.n] = s;
  });

  function zvyrazni(n) {
    Object.values(znEl).forEach(z => z.classList.remove('svit'));
    Object.values(slotEl).forEach(s => s.classList.remove('svit'));
    if (n != null) { znEl[n].classList.add('svit'); slotEl[n].classList.add('svit'); }
  }

  function kartaHtml(t) { return text(t, st.rezim); }

  function vykresli() {
    zasobnik.innerHTML = '';
    const pouzite = new Set(Object.values(st.mista).filter(Boolean));
    const volne = st.poradi.filter(n => !pouzite.has(n));
    if (!volne.length) zasobnik.appendChild(el('span', 'prazdno', 'Všechny pojmy jsou rozmístěné. Klikni na Zkontrolovat.'));
    volne.forEach(n => {
      const t = cfg.cile.find(c => c.n === n);
      const k = el('span', 'chip' + (st.vybrana === n ? ' vybrana' : ''), kartaHtml(t));
      k.dataset.karta = n;
      pripravTah(k, n);
      zasobnik.appendChild(k);
    });
    cfg.cile.forEach(c => {
      const s = slotEl[c.n], v = s.querySelector('.vlozeno');
      const id = st.mista[c.n];
      s.classList.remove('ok', 'spatne');
      if (id) {
        const t = cfg.cile.find(x => x.n === id);
        v.innerHTML = '<span class="chip vlozena">' + kartaHtml(t) + '</span>';
        pripravTah(v.firstChild, id, c.n);
        if (st.zkontrolovano) {
          const dobre = id === c.n;
          s.classList.add(dobre ? 'ok' : 'spatne');
          if (dobre) v.insertAdjacentHTML('beforeend', '<span class="druhy">' + druhy(st.rezim)(t) + '</span>');
        }
      } else v.innerHTML = '';
    });
  }

  function poloz(id, n) {
    for (const k in st.mista) if (st.mista[k] === id) st.mista[k] = null;
    st.mista[n] = id; st.vybrana = null; st.zkontrolovano = false; vykresli();
  }
  function vratDoZasobniku(n) { st.mista[n] = null; st.zkontrolovano = false; vykresli(); }

  function pripravTah(k, id, zSlotu) {
    k.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      const x0 = e.clientX, y0 = e.clientY; let duch = null;
      const pohyb = ev => {
        if (!duch && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 6) {
          duch = k.cloneNode(true); duch.classList.add('duch'); document.body.appendChild(duch);
        }
        if (duch) {
          duch.style.left = ev.clientX + 'px'; duch.style.top = ev.clientY + 'px';
          const cil = document.elementFromPoint(ev.clientX, ev.clientY);
          const s = cil && cil.closest('[data-slot]');
          zvyrazni(s ? +s.dataset.slot : null);
        }
      };
      const konec = ev => {
        document.removeEventListener('pointermove', pohyb); document.removeEventListener('pointerup', konec);
        if (duch) {
          duch.remove();
          const cil = document.elementFromPoint(ev.clientX, ev.clientY);
          const s = cil && cil.closest('[data-slot]');
          const z = cil && (cil.closest('[data-zasobnik]') || cil.closest('.znacka'));
          if (s) poloz(id, +s.dataset.slot);
          else if (z && z.classList && z.classList.contains('znacka')) poloz(id, +z.textContent);
          else if (zSlotu) vratDoZasobniku(zSlotu);
        } else {
          if (zSlotu) { vratDoZasobniku(zSlotu); return; }
          st.vybrana = st.vybrana === id ? null : id; vykresli();
        }
      };
      document.addEventListener('pointermove', pohyb); document.addEventListener('pointerup', konec);
    });
  }

  function kontrola() {
    const n = cfg.cile.length;
    const dobre = cfg.cile.filter(c => st.mista[c.n] === c.n).length;
    const umisteno = cfg.cile.filter(c => st.mista[c.n]).length;
    st.zkontrolovano = true;
    if (st.prvni == null && umisteno === n) st.prvni = dobre;
    let t = '<b>Správně: ' + dobre + ' / ' + n + '</b>';
    if (umisteno < n) t += ' · zbývá rozmístit ' + (n - umisteno);
    if (st.prvni != null) t += ' · napoprvé: ' + st.prvni + ' / ' + n + ' (' + Math.round(100 * st.prvni / n) + ' %)';
    if (dobre === n) t += ' · <span class="dobre">Výborně, vše sedí!</span>';
    stav.innerHTML = t; vykresli();
  }

  function nove() {
    st.mista = {}; st.vybrana = null; st.prvni = null; st.zkontrolovano = false;
    st.poradi = zamichej(cfg.cile.map(c => c.n));
    stav.innerHTML = cfg.napoveda; vykresli(); zvyrazni(null);
  }
  function rezim(r) {
    st.rezim = r; bCz.classList.toggle('aktivni', r === 'cz'); bLa.classList.toggle('aktivni', r === 'la'); nove();
  }
  bCz.onclick = () => rezim('cz'); bLa.onclick = () => rezim('la');
  bKontrola.onclick = kontrola;
  bVratit.onclick = () => { cfg.cile.forEach(c => { if (st.mista[c.n] && st.mista[c.n] !== c.n) st.mista[c.n] = null; }); st.zkontrolovano = false; vykresli(); };
  bReseni.onclick = () => { if (st.prvni == null) st.prvni = cfg.cile.filter(c => st.mista[c.n] === c.n).length; cfg.cile.forEach(c => st.mista[c.n] = c.n); kontrola(); };
  bNove.onclick = nove;
  nove();
}
