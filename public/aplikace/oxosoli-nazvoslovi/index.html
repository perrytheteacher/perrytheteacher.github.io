<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trenažér názvosloví oxosolí</title>
<style>
*{box-sizing:border-box}
body{margin:0 auto;padding:14px;max-width:1180px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2328;background:#fff;font-size:16px;line-height:1.5}
.top{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid #cfd4da;border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:none;background:#fff;padding:7px 11px;cursor:pointer;color:#1f2328}
.seg button+button{border-left:1px solid #cfd4da}.seg button.on{background:#1f2328;color:#fff}
.stat{font-size:14px;color:#5b6370}.stat b{color:#1a6d97}
.card{border:1px solid #e3e6ea;border-radius:14px;padding:18px}
.q{font-size:14px;color:#5b6370;margin-bottom:6px}
.big{font-size:34px;font-weight:700;text-align:center;margin:12px 0 16px;letter-spacing:.5px}
.name{font-size:24px;font-weight:700;text-align:center;margin:12px 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{font:inherit;font-size:18px;padding:8px 12px;border:1px solid #cfd4da;border-radius:9px;flex:1;min-width:200px}
input.good{border-color:#15803d;background:#e8f6ec}input.wrong{border-color:#b91c1c;background:#fdecec}
.prev{min-height:30px;font-size:22px;margin:8px 2px 0;color:#1a6d97}
.btn{font:inherit;font-size:15px;border:1px solid #cfd4da;background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;color:#1f2328}
.btn.primary{background:#1a6d97;border-color:#1a6d97;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.fb{margin-top:12px;padding:10px 14px;border-radius:9px;display:none;font-size:15px}
.fb.ok{display:block;background:#e8f6ec;color:#14532d}.fb.no{display:block;background:#fdecec;color:#7f1d1d}
.fb.ok .why,.fb.no .why{color:#1f2328;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{font:inherit;font-size:24px;border:2px solid #e3e6ea;border-radius:12px;padding:12px;min-height:64px;cursor:pointer;background:#fff;color:#1f2328}
.opt:hover{border-color:#1a6d97}.opt.good{border-color:#15803d;background:#e8f6ec}.opt.wrong{border-color:#b91c1c;background:#fdecec}
.hint{font-size:13px;color:#5b6370;margin-top:8px}
.done{text-align:center;padding:30px 10px}.done .score{font-size:40px;font-weight:800;color:#1a6d97}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:#eef4f8;color:#1a6d97;margin-left:6px;vertical-align:middle}
sub{font-size:.7em}
</style></head><body>

  if(grp==='h'){const left=hcount(acid)-aq;w+=` V aniontu ${left===1?'zůstal 1 vodík':'zůstaly '+left+' vodíky'} → předpona ${left===1?'hydrogen-':'dihydrogen-'}.`;}
  if(grp==='i')w+=' Isopolykyselina: n molekul kyseliny − (n − 1) H<sub>2</sub>O.';
  if(grp==='o')w+=' Počet H = 2 · počet O − oxidační číslo centrálního atomu.';
  if(a==='MnO4b')w+=' Pozor: manganan (Mn<sup>+VI</sup>, −II) ≠ manganistan (Mn<sup>+VII</sup>, −I).';
  if(a==='S2O3')w+=' Thio-: jeden kyslík síranu nahrazen sírou.';
  if(a==='S2O8')w+=' Peroxo-: anion obsahuje skupinu –O–O–.';
  if(c==='NH4')w+=' <b>Kation:</b> NH<sub>4</sub> počítáme jako celek, +I → <b>amonný</b>.';
  else if(VAR.includes(c))w+=` <b>Kation:</b> ${nc>1?nc+' · ':''}x + ${na>1?na+' · ':''}(${minus(aq)}) = 0 → x = +${ROM[cq]} → <b>${cn}</b>.`;
  else w+=` <b>Kation:</b> ${cs} má vždy +${ROM[cq]} → <b>${cn}</b>.`;
  w+=` <b>Vzorec křížem:</b> ${sub(part(cs,aq,cp)+part(as,cq,ap))}${g>1?' → zkrátíme '+g+' → '+sub(f):''}.`;
  return {k:c+'|'+a,f,n:an+' '+cn,an,cn,c,a,why:w,kind:'s'};
}
function hydrate(h){
  const [f,n,triv,c,a,cnt]=h;
  let w=cnt===0?`Bezvodá sůl – bez krystalové vody. Kation Cu má +II → měďnatý.`:
    `${triv}: ${cnt==='½'?'½ (hemi)':cnt} H<sub>2</sub>O → číslovka + hydrát + název soli ve 2. pádě.`;
  if(f.startsWith('KAl'))w+=' Kamenec je podvojná sůl: K<sup>+I</sup> + Al<sup>+III</sup> = +4 → 2 SO<sub>4</sub><sup>−II</sup>.';
  if(f.startsWith('Na2B4O7'))w+=' B<sub>4</sub>O<sub>7</sub> (−II) z kyseliny tetraborité H<sub>2</sub>B<sub>4</sub>O<sub>7</sub>.';
  return {k:f,f,n,why:w,kind:'h',triv};
}
function podv(p){return {k:p[0],f:p[0],n:p[1],why:p[2]+(p[3]?' ('+p[3]+')':'')+'. Kationty podle rostoucího oxidačního čísla, v názvu spojené pomlčkou.',kind:'p'};}

function pool(l){
  const s=D.PAIRS.filter(p=>p[2]===l).map(p=>simple(p[0],p[1]));
  if(l===0)return shuffle(s).slice(0,N);
  if(l===1){const base=shuffle(D.PAIRS.filter(p=>p[2]===0).map(p=>simple(p[0],p[1]))).slice(0,3);
    const h=shuffle(D.HYDRATY.map(hydrate)).slice(0,3);return shuffle(base.concat(h,shuffle(s).slice(0,N-6)));}
  const p=shuffle(D.PODV.map(podv)).slice(0,3);return shuffle(p.concat(shuffle(s).slice(0,N-3)));
}

function distract(x){
  const out=[];const push=(f,why)=>{if(f&&f!==x.f&&!out.some(o=>o.f===f))out.push({f,why});};
  if(x.kind==='s'){
    const [cs,cn,cq,cp]=D.CAT[x.c];const [as,an,aq,ap]=D.AN[x.a];const g=gcd(cq,aq),nc=aq/g,na=cq/g;
    const c1=[];
    if(nc!==na)c1.push([part(cs,na,cp)+part(as,nc,ap),'prohozené indexy – oxidační číslo aniontu patří jako index ke kationtu a naopak']);
    if(g>1)c1.push([part(cs,aq,cp)+part(as,cq,ap),'nezkrácené indexy – mají společného dělitele '+g]);
    if(na>1)c1.push([part(cs,nc,cp)+as+na,'chybí závorka – index by patřil jen k poslednímu atomu']);
    if(nc>1||na>1)c1.push([cs+as,'chybí indexy – součet oxidačních čísel není nula']);
    (D.CONF[x.a]||[]).forEach(b=>{if(D.AN[b])c1.push([formula(x.c,b),'to je '+D.AN[b][1]+' '+cn]);});
    const o=D.OTHER[x.c];if(o&&D.CAT[o])c1.push([formula(o,x.a),'to je '+an+' '+D.CAT[o][1]]);
    shuffle(c1).forEach(([f,w])=>push(f,w));
    shuffle(D.PAIRS.filter(p=>p[0]===x.c)).forEach(p=>{const y=simple(p[0],p[1]);push(y.f,'to je '+y.n);});
  } else if(x.kind==='h'){
    const m=x.f.match(/^(.*)·(.*)H2O$/);
    if(m){shuffle([2,5,7,10].filter(k=>String(k)!==m[2])).slice(0,2).forEach(k=>push(m[1]+'·'+k+'H2O','jiný počet molekul krystalové vody'));}
    shuffle(D.HYDRATY.map(hydrate)).forEach(y=>push(y.f,'to je '+y.n));
  } else {
    const v=[];
    if(/\(SO4\)2$/.test(x.f))v.push([x.f.replace(/\(SO4\)2$/,'(SO4)3'),'součet oxidačních čísel kationtů neodpovídá třem síranům']);
    if(/\(CO3\)2$/.test(x.f))v.push([x.f.replace(/\(CO3\)2$/,'CO3'),'jeden uhličitan (−II) nevyrovná +4']);
    if(x.f.startsWith('(NH4)2'))v.push([x.f.replace('(NH4)2','NH4'),'NH4 + kation +II = +3, sírany to nevyrovnají']);
    if(/^K[A-Z]/.test(x.f)&&!x.f.startsWith('K2'))v.push(['K2'+x.f.slice(1),'příliš mnoho draslíku – součet nesedí']);
    shuffle(v).forEach(([f,w])=>push(f,w));
    shuffle(D.PODV.map(podv)).forEach(y=>push(y.f,'to je '+y.n));
  }
  return out.slice(0,3);
}

const strip=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[‐-―−]/g,'-').trim();
const normName=s=>strip(s).replace(/[\s\-]+/g,'');
const normF=s=>s.replace(/[₀-₉]/g,d=>'0123456789'['₀₁₂₃₄₅₆₇₈₉'.indexOf(d)]).replace(/1\/2|0[.,]5/g,'½').replace(/\s+/g,'').replace(/[.*•∙⋅]/g,'·');

function diagName(x,v){
  if(x.kind!=='s')return 'Zkontroluj číslovku, pořadí slov a koncovky.';
  const w=strip(v).split(/\s+/);const A=normName(x.an),C=normName(x.cn);
  const a0=normName(w[0]||''),c0=normName(w.slice(1).join(''));
  if(a0===C&&c0===A)return 'Pořadí: nejdřív anion (podstatné jméno), pak kation (přídavné jméno).';
  if(a0===A)return 'Anion máš správně. Zkontroluj kation – oxidační číslo a koncovku přídavného jména.';
  if(c0===C)return 'Kation máš správně. Zkontroluj anion – z jaké kyseliny pochází a jakou má koncovku.';
  return 'Zkontroluj anion (kyselina, koncovka) i kation (oxidační číslo).';
}
function diagF(x,v){
  if(v.toLowerCase()===x.f.toLowerCase())return 'Pozor na velká a malá písmena ve značkách prvků.';
  const np=s=>s.replace(/[()]/g,'');
  if(np(v)===np(x.f))return 'Zkontroluj závorky – víceatomový iont s indexem větším než 1 patří do závorky.';
  const sk=s=>s.replace(/[\d()½·]/g,'');
  if(sk(v)===sk(x.f))return 'Prvky máš správně, zkontroluj indexy (křížové pravidlo, krácení).';
  return 'Zkontroluj anion (vzorec kyseliny bez vodíků) i počet kationtů a aniontů.';
}

let acted=false;document.addEventListener('pointerdown',()=>{acted=true;},true);document.addEventListener('keydown',()=>{acted=true;},true);
let mode='name',lvl=0,order=[],pos=0,ok=0,answered=false;
function start(){order=pool(lvl);pos=0;ok=0;render();}
function stat(){document.getElementById('pos').textContent=Math.min(pos+1,order.length);document.getElementById('tot').textContent=order.length;document.getElementById('ok').textContent=ok;}
const tag=x=>x.kind==='h'&&x.triv&&!x.triv.startsWith('bezvod')?`<span class="tag">${x.triv}</span>`:'';
function render(){
  answered=false;stat();const c=document.getElementById('card');
  if(pos>=order.length){c.innerHTML=`<div class="done"><div class="score">${ok} / ${order.length}</div><p>Hotovo! ${ok===order.length?'Bez jediné chyby.':'Chybné úlohy si projdi ještě jednou.'}</p><button class="btn primary" id="again">Znovu (nové úlohy)</button></div>`;document.getElementById('again').onclick=start;return;}
  const x=order[pos];
  if(mode==='name'){
    c.innerHTML=`<div class="q">Napiš ${x.kind==='h'?'systematický název':'název'}:</div><div class="big">${sub(x.f)}</div>
    <div class="row"><input type="text" id="ans" autocomplete="off" spellcheck="false" placeholder="např. síran sodný"><button class="btn primary" id="chk">Zkontrolovat</button><button class="btn" id="show">Ukázat řešení</button><button class="btn" id="next" disabled>Další →</button></div>
    <div class="fb" id="fb"></div>`;
    const inp=document.getElementById('ans');if(acted)inp.focus({preventScroll:true});
    const check=()=>{if(answered){next();return;}const v=inp.value;if(!normName(v))return;
      const good=normName(v)===normName(x.n);inp.classList.toggle('good',good);inp.classList.toggle('wrong',!good);const fb=document.getElementById('fb');
      if(good){answered=true;ok++;stat();fb.className='fb ok';fb.innerHTML=`<b>Správně: ${x.n}</b>${tag(x)}<div class="why">${x.why}</div>`;document.getElementById('next').disabled=false;}
      else{fb.className='fb no';fb.innerHTML=diagName(x,v)+' Zkus to znovu, nebo si nech ukázat řešení.';}};
    document.getElementById('chk').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
    document.getElementById('show').onclick=()=>{if(answered)return;answered=true;const fb=document.getElementById('fb');fb.className='fb no';fb.innerHTML=`Řešení: <b>${x.n}</b>${tag(x)}<div class="why">${x.why}</div>`;inp.value=x.n;document.getElementById('next').disabled=false;};
    document.getElementById('next').onclick=next;
  } else if(mode==='type'){
    c.innerHTML=`<div class="q">Napiš vzorec (čísla piš normálně: Al2(SO4)3, krystalovou vodu odděl tečkou: CuSO4.5H2O):</div><div class="name">${x.n}${tag(x)}</div>
    <div class="row"><input type="text" id="ans" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="např. Na2SO4"><button class="btn primary" id="chk">Zkontrolovat</button><button class="btn" id="show">Ukázat řešení</button><button class="btn" id="next" disabled>Další →</button></div>
    <div class="prev" id="prev"></div><div class="fb" id="fb"></div>`;
    const inp=document.getElementById('ans'),prev=document.getElementById('prev');if(acted)inp.focus({preventScroll:true});
    inp.oninput=()=>{prev.innerHTML=sub(normF(inp.value).replace(/</g,'&lt;'));};
    const check=()=>{if(answered){next();return;}const v=normF(inp.value);if(!v)return;
      const good=v===x.f;inp.classList.toggle('good',good);inp.classList.toggle('wrong',!good);const fb=document.getElementById('fb');
      if(good){answered=true;ok++;stat();fb.className='fb ok';fb.innerHTML=`<b>Správně: ${sub(x.f)}</b><div class="why">${x.why}</div>`;document.getElementById('next').disabled=false;}
      else{fb.className='fb no';fb.innerHTML=diagF(x,v)+' Zkus to znovu, nebo si nech ukázat řešení.';}};
    document.getElementById('chk').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
    document.getElementById('show').onclick=()=>{if(answered)return;answered=true;const fb=document.getElementById('fb');fb.className='fb no';fb.innerHTML=`Řešení: <b>${sub(x.f)}</b><div class="why">${x.why}</div>`;inp.value=x.f;prev.innerHTML=sub(x.f);document.getElementById('next').disabled=false;};
    document.getElementById('next').onclick=next;
  } else {
    const opts=shuffle([{f:x.f,why:''},...distract(x)]);
    c.innerHTML=`<div class="q">Který vzorec patří k názvu?</div><div class="name">${x.n}${tag(x)}</div><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${sub(o.f)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div><div class="row" style="margin-top:12px"><button class="btn primary" id="next" disabled>Další →</button></div>`;
    c.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{if(answered)return;answered=true;const o=opts[+el.dataset.i];const good=o.f===x.f;
      c.querySelectorAll('.opt').forEach((e2,j)=>{if(opts[j].f===x.f)e2.classList.add('good');});if(!good)el.classList.add('wrong');
      if(good){ok++;stat();}const fb=document.getElementById('fb');fb.className='fb '+(good?'ok':'no');
      fb.innerHTML=(good?'<b>Správně!</b>':`<b>Vedle.</b> ${sub(o.f)}: ${o.why}.`)+`<div class="why">${x.why}</div>`;
      document.getElementById('next').disabled=false;});
    document.getElementById('next').onclick=next;
  }
}
function next(){pos++;render();}
document.getElementById('mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;document.querySelectorAll('#mode button').forEach(y=>y.classList.toggle('on',y===b));start();};
document.getElementById('lvl').onclick=e=>{const b=e.target.closest('button');if(!b)return;lvl=+b.dataset.l;document.querySelectorAll('#lvl button').forEach(y=>y.classList.toggle('on',y===b));start();};
start();
</script>
</body></html>
