<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rozpustnost alkoholů ve vodě</title>
<style>
:root{
  --ink:#1f2328; --muted:#5b6370; --line:#e3e6ea; --bg:#f6f7f9; --card:#fff;
  --accent:#4c51bf; --accent-soft:#eef0ff;
  --c-M:#4c51bf; --c-mp:#0f766e; --c-bp:#dc2626; --c-rho:#d97706; --c-sol:#2563eb; --c-alk:#8b929c;
  --ok:#15803d; --ok-soft:#e8f6ec; --bad:#b91c1c; --bad-soft:#fdecec; --teach:#7c3aed; --teach-soft:#f5f0ff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:17px}
a{color:var(--accent)}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.crumbs{font-size:14px;color:var(--muted)}
.crumbs b{color:var(--ink)}
.teach-toggle{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--teach);cursor:pointer;user-select:none;border:1px solid #ddd0fb;background:var(--teach-soft);padding:6px 12px;border-radius:999px}
.teach-toggle input{accent-color:var(--teach)}
.layout{max-width:1180px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px}
nav.toc{position:sticky;top:16px;align-self:start;font-size:14px}
nav.toc ol{list-style:none;padding:0;margin:0;counter-reset:t}
nav.toc li{counter-increment:t}
nav.toc a{display:block;padding:6px 10px;border-radius:8px;color:var(--muted);text-decoration:none;border-left:3px solid transparent}
nav.toc a::before{content:counter(t) ". ";color:#a0a6af}
nav.toc a:hover{background:#fff;color:var(--ink)}
nav.toc a.active{background:#fff;color:var(--accent);border-left-color:var(--accent);font-weight:600}
main{min-width:0}
h1{font-size:34px;line-height:1.2;margin:0 0 8px}
.lead{font-size:19px;color:var(--muted);margin:0 0 20px}
section.mod{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 30px;margin:0 0 24px;scroll-margin-top:16px}
section.mod>h2{font-size:25px;margin:0 0 6px}
section.mod>h2 .num{color:var(--accent);margin-right:8px}
h3{font-size:19px;margin:22px 0 8px}
p{margin:8px 0}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;padding:0;list-style:none;margin:14px 0 0}
.goals li{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:15px}
.mol{display:block;height:auto;image-rendering:auto}
.mol.center{margin:0 auto}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.card h4{margin:0 0 8px;font-size:17px}
.card .molbox{min-height:110px;display:flex;align-items:center;justify-content:center;padding:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{font:inherit;font-size:15px;border:1px solid #cfd4da;background:#fff;color:var(--ink);padding:7px 14px;border-radius:9px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn:disabled{cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0}
.callout.warn{border-color:#d97706;background:#fff6e8}
.feedback{margin-top:8px;font-size:15px;padding:8px 12px;border-radius:8px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);color:#14532d}
.feedback.no{background:var(--bad-soft);color:#7f1d1d}
details.teacher{display:none;margin:16px 0 0;border:1px dashed #c9b6f7;background:var(--teach-soft);border-radius:12px;padding:10px 16px;font-size:15px}
body.teach details.teacher{display:block}
details.teacher summary{cursor:pointer;color:var(--teach);font-weight:600}
details.teacher ol,details.teacher ul{padding-left:20px;margin:6px 0}
details.reveal{margin:8px 0;border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:#fafbfc}
details.reveal summary{cursor:pointer;font-weight:600}
details.reveal[open] summary{margin-bottom:6px}
table.data{border-collapse:collapse;width:100%;font-size:14.5px}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child,table.data td.l,table.data th.l{text-align:left}
table.data th{font-weight:600;color:var(--muted);background:#fafbfc;position:sticky;top:0}
.scroll{overflow-x:auto}
/* riddle */
.riddle .card{text-align:center}
.riddle .facts{font-size:15px;margin-top:8px;text-align:left}
.riddle .hidden{display:none}
.state{display:inline-block;font-weight:700;padding:2px 10px;border-radius:999px;font-size:14px}
.state.gas{background:#e8f0fe;color:#1d4ed8}.state.liq{background:#e8f6ec;color:#15803d}
/* sorter */
.sorter{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.sorter .card .q{font-size:14px;color:var(--muted);margin:8px 0 4px}
.sorter .card .row .btn{font-size:14px;padding:5px 10px}
.score{font-weight:700;color:var(--accent)}
/* app */
.app{border:2px solid var(--accent-soft);border-radius:16px;padding:18px;margin-top:14px;background:#fcfcff}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.tab{font:inherit;font-size:15px;border:none;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600}
.tab:hover{background:#eef0f4;color:var(--ink)}
.tab.on{background:var(--accent);color:#fff}
.tab .new{font-size:11px;background:#fde68a;color:#7c4a03;border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:2px}
.tab.on .new{background:#fff;color:var(--accent)}
.pane{display:none}.pane.on{display:block}
.propbtn{font:inherit;font-size:14px;font-weight:600;border:2px solid currentColor;background:#fff;padding:6px 12px;border-radius:9px;cursor:pointer}
.propbtn.on{color:#fff !important}
.chartbox{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid #d5d9df;box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:10px;padding:8px 12px;font-size:13.5px;line-height:1.45;display:none;z-index:5;max-width:300px}
.tip img{max-width:100%;height:auto;margin:4px 0}
.ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:10px 0;font-size:15px}
.ctrl label{display:flex;align-items:center;gap:6px;cursor:pointer}
.seg{display:inline-flex;border:1px solid #cfd4da;border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:none;background:#fff;padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid #cfd4da}
.seg button.on{background:var(--ink);color:#fff}
.trends{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px}
.multi .chartbox{margin-bottom:6px}
.info{position:sticky;top:12px;align-self:start;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:14.5px}
.info .nm{font-weight:700;font-size:16px}
.info .vals div{display:flex;justify-content:space-between;border-bottom:1px solid #f0f1f3;padding:4px 0}
.info .vals span:first-child{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.rbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:8px 0}
.rval{font-size:28px;font-weight:800}
.bars .bar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:5px 0;font-size:14.5px}
.bars .track{background:#f0f1f4;border-radius:6px;height:20px;position:relative;overflow:hidden}
.bars .fill{height:100%;border-radius:6px;transition:width .5s}
.bars .v{text-align:right;font-variant-numeric:tabular-nums}
.iso{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.iso .card{cursor:pointer}
.iso .card.sel{outline:3px solid var(--accent)}
.iso .card .tag{font-size:12.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
/* hbond svg */
.svgbox{border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px}
.svgbox svg{width:100%;height:auto;display:block}
/* solubility */
.solviz{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
.split{display:flex;height:34px;border-radius:9px;overflow:hidden;font-size:13px;font-weight:700;color:#fff;margin:10px 0}
.split div{display:flex;align-items:center;justify-content:center;transition:width .4s;white-space:nowrap;overflow:hidden}
.gauge{height:16px;border-radius:8px;background:linear-gradient(90deg,#fee2e2,#fef3c7,#dcfce7,#bfdbfe);position:relative;margin:26px 0 6px}
.gauge .needle{position:absolute;top:-8px;width:4px;height:32px;background:var(--ink);border-radius:2px;transition:left .4s}
.gauge-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.bigval{font-size:24px;font-weight:800}
/* azeotrope */
.aze{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px}
.log{font-size:14px;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fafbfc}
.log div{padding:3px 0;border-bottom:1px dashed #e6e8eb}
/* exercise */
.fill-q{margin:10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fill-q input{font:inherit;font-size:15px;padding:5px 10px;border:1px solid #cfd4da;border-radius:8px;min-width:150px}
.fill-q input.good{border-color:var(--ok);background:var(--ok-soft)}
.fill-q input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fill-q .sol{font-size:13.5px;color:var(--muted);display:none}
.fill-q .sol.show{display:inline}
footer.ai{max-width:1180px;margin:0 auto;padding:0 20px 30px;font-size:12px;color:#8a919b;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.toc{position:static}
  nav.toc ol{display:flex;flex-wrap:wrap;gap:4px}
  nav.toc a{border-left:none;background:#fff;border:1px solid var(--line)}
  .trends,.solviz,.aze{grid-template-columns:1fr}
  .info{position:static}
  section.mod{padding:20px 16px}
  .bars .bar{grid-template-columns:110px 1fr 70px}
}

body{background:#fff;padding:14px;font-size:16px}
.app{border:none;padding:0;margin:0;background:#fff}
@media (min-width:560px){.solviz{grid-template-columns:minmax(0,1fr) 220px}}

/* celá obrazovka: obsah vycentrovat a grafy omezit výškou okna */
body{max-width:1180px;margin-left:auto;margin-right:auto}
.chartbox svg{max-height:70vh}
.multi .chartbox svg{max-height:17vh;min-height:90px}
#azChart svg{max-height:68vh}
img{max-width:100%;height:auto}

function molImg(k, s){ s = s||SCALE; const m = MOLS[k]; return `<img class="mol" src="${m.src}" width="${Math.round(m.w*s)}" height="${Math.round(m.h*s)}" alt="">`; }
const MINUS='−';
function fmt(v,d){ if(v===null||v===undefined) return '–'; if(!isFinite(v)) return '∞'; let s=v.toFixed(d).replace('.',','); return s.replace('-',MINUS); }

/* ------------------ CHART ENGINE (SVG) ------------------ */
function niceTicks(min,max,n){
  const span=max-min; if(span<=0) return [min];
  const step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const err=step0/mag; let step=mag*(err>=7.5?10:err>=3.5?5:err>=1.5?2:1);
  const t=[]; for(let v=Math.ceil(min/step-1e-9)*step; v<=max+1e-9; v+=step) t.push(+v.toFixed(10));
  return t;
}
function el(tag,attrs,txt){ const e=document.createElementNS('http://www.w3.org/2000/svg',tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(txt!==undefined) e.textContent=txt; return e; }

/* lineChart: cfg {W,H,series:[{xs,ys,color,dash,name,main,flags,width,hollow}], xLabel,yLabel,yLog,yMin,yMax,xMin,xMax,xTicks:[{v,l}],tip:(i)=>html,onHover,margin,compact} */
function lineChart(box,cfg){
  box.innerHTML='';
  const W=cfg.W||720,H=cfg.H||340, m=Object.assign({l:64,r:18,t:14,b:cfg.compact?26:48},cfg.margin||{});
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img'}); box.appendChild(svg);
  const tip=document.createElement('div'); tip.className='tip'; box.appendChild(tip);
  const tf=v=>cfg.yLog? Math.log10(v): v;
  let ys=[]; cfg.series.forEach(s=>s.ys.forEach((v,i)=>{ if(v!==null&&v!==undefined&&isFinite(v)) ys.push(tf(v)); }));
  let yMin=cfg.yMin!==undefined?tf(cfg.yMin):Math.min(...ys), yMax=cfg.yMax!==undefined?tf(cfg.yMax):Math.max(...ys);
  if(cfg.yMin===undefined||cfg.yMax===undefined){ const pad=(yMax-yMin)*0.08||1; if(cfg.yMin===undefined) yMin-=pad; if(cfg.yMax===undefined) yMax+=pad; }
  let xsAll=[]; cfg.series.forEach(s=>xsAll.push(...s.xs));
  let xMin=cfg.xMin!==undefined?cfg.xMin:Math.min(...xsAll), xMax=cfg.xMax!==undefined?cfg.xMax:Math.max(...xsAll);
  const xp=(xMax-xMin)*0.04; if(cfg.xMin===undefined) xMin-=xp; if(cfg.xMax===undefined) xMax+=xp;
  const X=v=>m.l+(v-xMin)/(xMax-xMin)*(W-m.l-m.r), Y=v=>H-m.b-(tf(v)-yMin)/(yMax-yMin)*(H-m.t-m.b);
  const Yt=t=>H-m.b-(t-yMin)/(yMax-yMin)*(H-m.t-m.b);
  // grid + y ticks
  let yt;
  if(cfg.yLog){ yt=[]; for(let p=Math.ceil(yMin);p<=Math.floor(yMax);p++) yt.push(p); }
  else yt=niceTicks(yMin,yMax,cfg.compact?3:6);
  const g=el('g',{});svg.appendChild(g);
  yt.forEach(t=>{ const y=Yt(t); g.appendChild(el('line',{x1:m.l,x2:W-m.r,y1:y,y2:y,stroke:'#eceef1'}));
    let lab = cfg.yLog? (t>=0? fmt(Math.pow(10,t),0): fmt(Math.pow(10,t),-t)) : fmt(t, Math.max(0,-Math.floor(Math.log10(Math.abs(yt[1]-yt[0]||1))+1e-9)));
    if(cfg.yFmt) lab=cfg.yFmt(t);
    g.appendChild(el('text',{x:m.l-8,y:y+4,'text-anchor':'end','font-size':cfg.compact?11:12,fill:'#6b7280'},lab)); });
  // x ticks
  const xt=cfg.xTicks||niceTicks(xMin,xMax,8).map(v=>({v,l:fmt(v,0)}));
  xt.forEach(t=>{ const x=X(t.v); if(x<m.l-1||x>W-m.r+1) return; g.appendChild(el('line',{x1:x,x2:x,y1:H-m.b,y2:H-m.b+4,stroke:'#9aa1ab'}));
    g.appendChild(el('text',{x,y:H-m.b+(cfg.compact?15:17),'text-anchor':'middle','font-size':cfg.compact?11:12,fill:'#6b7280'},t.l)); });
  g.appendChild(el('line',{x1:m.l,x2:W-m.r,y1:H-m.b,y2:H-m.b,stroke:'#9aa1ab'}));
  if(cfg.xLabel) g.appendChild(el('text',{x:(m.l+W-m.r)/2,y:H-8,'text-anchor':'middle','font-size':13,fill:'#374151'},cfg.xLabel));
  if(cfg.yLabel) g.appendChild(el('text',{x:14,y:(m.t+H-m.b)/2,'text-anchor':'middle','font-size':cfg.compact?11.5:13,fill:'#374151',transform:`rotate(-90 14 ${(m.t+H-m.b)/2})`},cfg.yLabel));
  if(cfg.title) g.appendChild(el('text',{x:m.l+4,y:m.t+12,'font-size':13,'font-weight':700,fill:cfg.titleColor||'#111'},cfg.title));
  if(cfg.extra) cfg.extra(svg,X,Y);
  // series
  const ptsBy=[];
  cfg.series.forEach((s,si)=>{
    let d='',pen=false;
    s.ys.forEach((v,i)=>{ if(v===null||v===undefined||(!isFinite(v)&&!s.flags)){pen=false;return;}
      let vv=isFinite(v)?v:(cfg.yMax||v); const x=X(s.xs[i]),y=Y(vv); d+=(pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '; pen=true; });
    if(d) svg.appendChild(el('path',{d,fill:'none',stroke:s.color,'stroke-width':s.width||(cfg.compact?2.2:3),'stroke-dasharray':s.dash||'','stroke-linejoin':'round','stroke-linecap':'round'}));
    const pts=[];
    s.ys.forEach((v,i)=>{ if(v===null||v===undefined) {pts.push(null);return;}
      const inf=!isFinite(v); if(inf&&!s.flags){pts.push(null);return;}
      const x=X(s.xs[i]), y=Y(inf?cfg.yMax:v); let p;
      const r=cfg.compact?3.6:5.2;
      if(inf) p=el('path',{d:`M${x} ${y-r-1} L${x+r+1} ${y+r} L${x-r-1} ${y+r} Z`,fill:'#fff',stroke:s.color,'stroke-width':2});
      else p=el('circle',{cx:x,cy:y,r,fill:s.hollow?'#fff':s.color,stroke:s.hollow?s.color:'#fff','stroke-width':2});
      svg.appendChild(p); pts.push({p,x,y,r});
    });
    ptsBy.push(pts);
  });
  const cross=el('line',{y1:m.t,y2:H-m.b,stroke:'#111','stroke-opacity':.25,'stroke-dasharray':'4 4',visibility:'hidden'}); svg.appendChild(cross);
  const main=cfg.series.find(s=>s.main)||cfg.series[0];
  const ov=el('rect',{x:m.l,y:m.t,width:W-m.l-m.r,height:H-m.t-m.b,fill:'transparent'}); svg.appendChild(ov);
  let cur=-1;
  function setHover(i,fromEvt){
    if(i===cur) return; cur=i;
    ptsBy.forEach((pts,si)=>pts.forEach((o,j)=>{ if(!o) return; const big=(i>=0 && j===i+(cfg.series[si].shift||0)); if(o.p.tagName==='circle') o.p.setAttribute('r',big?o.r*1.6:o.r); }));
    if(i<0){cross.setAttribute('visibility','hidden');tip.style.display='none';return;}
    const x=X(main.xs[i]); cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.setAttribute('visibility','visible');
    if(cfg.tip && fromEvt){ tip.innerHTML=cfg.tip(i); tip.style.display='block';
      const bw=box.clientWidth, sx=x/W*svg.clientWidth; const tw=tip.offsetWidth;
      let left=sx+18; if(left+tw>bw-4) left=sx-tw-18; if(left<4) left=4; tip.style.left=left+'px'; tip.style.top='10px'; }
    else tip.style.display='none';
  }
  function evt(e){ const r=svg.getBoundingClientRect(); const sx=(e.clientX-r.left)/r.width*W;
    let best=-1,bd=1e9; main.xs.forEach((xv,i)=>{ if(main.ys[i]===null) return; const dd=Math.abs(X(xv)-sx); if(dd<bd){bd=dd;best=i;} });
    setHover(best,true); if(cfg.onHover) cfg.onHover(best); }
  ov.addEventListener('pointermove',evt); ov.addEventListener('pointerdown',evt);
  ov.addEventListener('pointerleave',()=>{ setHover(-1,true); if(cfg.onHover) cfg.onHover(-1); });
  return {setHover:(i)=>setHover(i,false), X, Y, svg};
}

/* scatter with regression */
function scatterChart(box,cfg){
  box.innerHTML='';
  const W=720,H=360,m={l:70,r:20,t:16,b:50};
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`}); box.appendChild(svg);
  const xs=cfg.xs, ys=cfg.ys;
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const px=(x1-x0)*0.08||1, py=(y1-y0)*0.1||1; x0-=px;x1+=px;y0-=py;y1+=py;
  const X=v=>m.l+(v-x0)/(x1-x0)*(W-m.l-m.r), Y=v=>H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
  niceTicks(y0,y1,6).forEach(t=>{ svg.appendChild(el('line',{x1:m.l,x2:W-m.r,y1:Y(t),y2:Y(t),stroke:'#eceef1'})); svg.appendChild(el('text',{x:m.l-8,y:Y(t)+4,'text-anchor':'end','font-size':12,fill:'#6b7280'},cfg.yFmt?cfg.yFmt(t):fmt(t,cfg.yDec))); });
  niceTicks(x0,x1,8).forEach(t=>{ svg.appendChild(el('line',{x1:X(t),x2:X(t),y1:H-m.b,y2:H-m.b+4,stroke:'#9aa1ab'})); svg.appendChild(el('text',{x:X(t),y:H-m.b+17,'text-anchor':'middle','font-size':12,fill:'#6b7280'},cfg.xFmt?cfg.xFmt(t):fmt(t,cfg.xDec))); });
  svg.appendChild(el('line',{x1:m.l,x2:W-m.r,y1:H-m.b,y2:H-m.b,stroke:'#9aa1ab'}));
  svg.appendChild(el('text',{x:(m.l+W-m.r)/2,y:H-10,'text-anchor':'middle','font-size':13,fill:'#374151'},cfg.xLabel));
  svg.appendChild(el('text',{x:16,y:(m.t+H-m.b)/2,'text-anchor':'middle','font-size':13,fill:'#374151',transform:`rotate(-90 16 ${(m.t+H-m.b)/2})`},cfg.yLabel));
  // regression
  const n=xs.length, mx=xs.reduce((a,b)=>a+b)/n, my=ys.reduce((a,b)=>a+b)/n;
  let sxy=0,sxx=0; xs.forEach((x,i)=>{sxy+=(x-mx)*(ys[i]-my);sxx+=(x-mx)**2;});
  const k=sxy/sxx, q=my-k*mx;
  svg.appendChild(el('line',{x1:X(x0),y1:Y(k*x0+q),x2:X(x1),y2:Y(k*x1+q),stroke:'#9ca3af','stroke-width':2,'stroke-dasharray':'6 5'}));
  xs.forEach((x,i)=>{ const c=el('circle',{cx:X(x),cy:Y(ys[i]),r:7,fill:'#4c51bf',stroke:'#fff','stroke-width':2}); const t=el('title',{},cfg.labels[i]); c.appendChild(t); svg.appendChild(c);
    svg.appendChild(el('text',{x:X(x)+9,y:Y(ys[i])-8,'font-size':12,fill:'#374151','font-weight':600},cfg.short[i])); });
}
function pearson(xs,ys){ const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n; let a=0,b=0,c=0; xs.forEach((x,i)=>{a+=(x-mx)*(ys[i]-my);b+=(x-mx)**2;c+=(ys[i]-my)**2;}); return a/Math.sqrt(b*c); }


/* ------------------ 6 SOLUBILITY ------------------ */
(function(){
  const r=document.getElementById('solRange');
  function draw(){ const n=+r.value, i=n-1;
    document.getElementById('solName').innerHTML=`${NAMES[i]} <span class="muted small">· ${FORM[i]}</span>`;
    const w=MOLS['c'+n].w; document.getElementById('solMol').innerHTML=molImg('c'+n,Math.min(0.72,520/w));
    // hydrophilic: OH (O+H = 17), hydrophobic: CnH2n+1
    const hyd=17, pho=12*n+(2*n+1); const ph=hyd/(hyd+pho)*100;
    document.getElementById('solHyd').style.width=ph+'%'; document.getElementById('solPho').style.width=(100-ph)+'%';
    document.getElementById('solHyd').textContent= ph>12?'–OH':''; document.getElementById('solPho').textContent=`řetězec C${n}`;
    document.getElementById('solRatio').textContent=`Hydrofilní –OH tvoří ${fmt(ph,0)} % hmotnosti molekuly, hydrofobní řetězec ${fmt(100-ph,0)} %.`;
    const s=ALC.sol[i];
    document.getElementById('solVal').textContent= isFinite(s)? fmtSol(s)+' / 100 g vody' : '∞';
    document.getElementById('solTxt').innerHTML= `<b>${ALC.solTxt[i]}</b>`+ (n<=3?'<br><span class="small muted">mísí se s vodou v libovolném poměru</span>': n===4?'<br><span class="small muted">po protřepání se vytvoří dvě vrstvy</span>':'');
    const pos= isFinite(s)? (Math.log10(s)+3)/(Math.log10(SOLMAX)+3)*100 : 98;
    document.getElementById('solNeedle').style.left=`calc(${Math.max(1,Math.min(98,pos))}% - 2px)`;
  }
  r.addEventListener('input',draw); draw();
})();
