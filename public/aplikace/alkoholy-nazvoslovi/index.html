<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trenažér názvosloví alkoholů</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2328;background:#fff;font-size:16px;line-height:1.5}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid #cfd4da;border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:none;background:#fff;padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid #cfd4da}.seg button.on{background:#1f2328;color:#fff}
.stat{font-size:14px;color:#5b6370}.stat b{color:#1a6d97}
.card{border:1px solid #e3e6ea;border-radius:14px;padding:18px}
.q{font-size:14px;color:#5b6370;margin-bottom:6px}
.mol{display:flex;justify-content:center;align-items:center;min-height:130px;padding:6px 0}
.mol img{max-width:100%;height:auto}
.name{font-size:22px;font-weight:700;text-align:center;margin:10px 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{font:inherit;font-size:17px;padding:8px 12px;border:1px solid #cfd4da;border-radius:9px;flex:1;min-width:200px}
input.good{border-color:#15803d;background:#e8f6ec}input.wrong{border-color:#b91c1c;background:#fdecec}
.btn{font:inherit;font-size:15px;border:1px solid #cfd4da;background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer}
.btn.primary{background:#1a6d97;border-color:#1a6d97;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.fb{margin-top:12px;padding:10px 14px;border-radius:9px;display:none;font-size:15px}
.fb.ok{display:block;background:#e8f6ec;color:#14532d}.fb.no{display:block;background:#fdecec;color:#7f1d1d}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{border:2px solid #e3e6ea;border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center;min-height:120px;cursor:pointer;background:#fff}
.opt:hover{border-color:#1a6d97}.opt.good{border-color:#15803d;background:#e8f6ec}.opt.wrong{border-color:#b91c1c;background:#fdecec}
.opt img,.mol img{max-width:100%;height:auto;mix-blend-mode:multiply}
.hint{font-size:13px;color:#5b6370;margin-top:8px}
.done{text-align:center;padding:30px 10px}.done .big{font-size:40px;font-weight:800;color:#1a6d97}

/* celá obrazovka: obsah vycentrovat a grafy omezit výškou okna */
body{max-width:1180px;margin-left:auto;margin-right:auto}
.chartbox svg{max-height:70vh}
.multi .chartbox svg{max-height:17vh;min-height:90px}
#azChart svg{max-height:68vh}
img{max-width:100%;height:auto}
</style></head><body>

    document.getElementById('next').onclick=next;
  } else {
    let same=shuffle(ITEMS.filter(y=>y!==x&&y.f===x.f)); let rest=shuffle(ITEMS.filter(y=>y!==x&&y.f!==x.f&&(lvl||!y.adv)));
    const opts=shuffle([x,...same.concat(rest).slice(0,3)]);
    c.innerHTML=`<div class="q">Který vzorec patří k názvu?</div><div class="name">${x.n}</div><div class="opts">${opts.map((o,i)=>`<div class="opt" data-i="${i}">${img(o,0.8)}</div>`).join('')}</div>
    <div class="fb" id="fb"></div><div class="row" style="margin-top:12px"><button class="btn primary" id="next" disabled>Další →</button></div>`;
    c.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{ if(answered) return; answered=true; const o=opts[+el.dataset.i]; const good=o===x;
      c.querySelectorAll('.opt').forEach((e2,j)=>{ if(opts[j]===x) e2.classList.add('good'); }); if(!good) el.classList.add('wrong');
      if(good){ok++;stat();} const fb=document.getElementById('fb'); fb.className='fb '+(good?'ok':'no');
      fb.innerHTML=(good?'<b>Správně!</b> ':'<b>Vedle.</b> '+(o.f===x.f?'Vybraný vzorec je izomer se stejným souhrnným vzorcem, ale jiným názvem: <b>'+o.n+'</b>. ':'Vybraný vzorec je <b>'+o.n+'</b>. '))+`<div class="hint">${x.h}</div>`;
      document.getElementById('next').disabled=false; });
    document.getElementById('next').onclick=next;
  }
}
function next(){ pos++; render(); }
document.getElementById('mode').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; mode=b.dataset.m; document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b)); start(); };
document.getElementById('lvl').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; lvl=+b.dataset.l; document.querySelectorAll('#lvl button').forEach(x=>x.classList.toggle('on',x===b)); start(); };
start();
</script></body></html>
