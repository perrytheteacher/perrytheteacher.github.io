const RX=[['na','s Na → alkoholát'],['ester','esterifikace (kys. octová)'],['hbr','substituce (HBr)'],['elim','eliminace (H₂SO₄, t)'],['ox','oxidace (K₂Cr₂O₇/H₂SO₄)']];
let a=D.alc[1].k, r='ox', shown=false;
document.getElementById('alks').innerHTML=D.alc.map(x=>`<button class="alk" data-k="${x.k}"><img src="${x.img}" width="${Math.round(x.w*0.48)}" alt=""><span class="n">${x.n}</span><span class="t">${x.typ}</span></button>`).join('');
document.getElementById('rxs').innerHTML=RX.map(x=>`<button class="rx" data-r="${x[0]}">${x[1]}</button>`).join('');
document.getElementById('alks').onclick=e=>{const b=e.target.closest('.alk');if(!b)return;a=b.dataset.k;draw();};
document.getElementById('rxs').onclick=e=>{const b=e.target.closest('.rx');if(!b)return;r=b.dataset.r;draw();};
document.getElementById('show').onclick=()=>{shown=true;draw(true);};
document.getElementById('pred').onchange=()=>draw();
function draw(keep){
  if(!keep) shown=!document.getElementById('pred').checked;
  document.querySelectorAll('.alk').forEach(b=>b.classList.toggle('on',b.dataset.k===a));
  document.querySelectorAll('.rx').forEach(b=>b.classList.toggle('on',b.dataset.r===r));
  const x=D.rx[a+'|'+r], im=shown?x.sol:x.zak;
  document.getElementById('sch').innerHTML=`<img src="${im.src}" width="${Math.round(im.w*0.8)}" alt="">`;
  const res=document.getElementById('res'); res.classList.toggle('show',shown);
  res.innerHTML=`<b>${x.name}</b><p>${x.note}</p>`;
  document.getElementById('show').style.display=shown?'none':'';
}
draw();
</script></body></html>
