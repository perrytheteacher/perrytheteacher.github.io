<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Schéma: společná příčina (růst těla) ovlivňuje výšku i rozpětí paží, které spolu proto korelují" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="760" height="330" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<rect x="210" y="20" width="340" height="74" rx="10" fill="#fdebc8" stroke="#333"/><text x="380.0" y="53.0" text-anchor="middle" font-size="17" font-weight="600" fill="#111">Společná příčina: růst těla</text><text x="380.0" y="75.0" text-anchor="middle" font-size="13" fill="#333">geny · růstový hormon · výživa · věk · pohlaví</text>
<rect x="60" y="210" width="240" height="64" rx="10" fill="#d6eef9" stroke="#333"/><text x="180.0" y="248.0" text-anchor="middle" font-size="17" font-weight="600" fill="#111">výška</text>
<rect x="460" y="210" width="240" height="64" rx="10" fill="#d6eef9" stroke="#333"/><text x="580.0" y="248.0" text-anchor="middle" font-size="17" font-weight="600" fill="#111">rozpětí paží</text>
<line x1="320" y1="96" x2="200" y2="206" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="440" y1="96" x2="560" y2="206" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="306" y1="242" x2="454" y2="242" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/><text x="380" y="232" text-anchor="middle" font-size="14" fill="#c0392b">korelace</text><text x="380" y="264" text-anchor="middle" font-size="13" fill="#c0392b">(ne příčina a následek)</text>
<text x="250" y="150" text-anchor="end" font-size="14" fill="#333">způsobuje</text><text x="510" y="150" font-size="14" fill="#333">způsobuje</text>
<text x="380" y="312" text-anchor="middle" font-size="13" fill="#666">Delší paže nikoho „nevytáhnou“ do výšky. Obojí roste zároveň, protože roste celá kostra.</text></svg>