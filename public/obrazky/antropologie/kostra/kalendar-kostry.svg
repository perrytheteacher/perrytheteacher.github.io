<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 442" role="img" aria-label="Časová osa: kdy se na kostře objevují věkové znaky od narození do 40 let" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="760" height="442" fill="#fff"/>
<line x1="40.0" y1="36" x2="40.0" y2="406" stroke="#e3e6ea"/><text x="40.0" y="424" text-anchor="middle" font-size="13" fill="#333">0</text>
<line x1="125.0" y1="36" x2="125.0" y2="406" stroke="#e3e6ea"/><text x="125.0" y="424" text-anchor="middle" font-size="13" fill="#333">5</text>
<line x1="210.0" y1="36" x2="210.0" y2="406" stroke="#e3e6ea"/><text x="210.0" y="424" text-anchor="middle" font-size="13" fill="#333">10</text>
<line x1="295.0" y1="36" x2="295.0" y2="406" stroke="#e3e6ea"/><text x="295.0" y="424" text-anchor="middle" font-size="13" fill="#333">15</text>
<line x1="380.0" y1="36" x2="380.0" y2="406" stroke="#e3e6ea"/><text x="380.0" y="424" text-anchor="middle" font-size="13" fill="#333">20</text>
<line x1="465.0" y1="36" x2="465.0" y2="406" stroke="#e3e6ea"/><text x="465.0" y="424" text-anchor="middle" font-size="13" fill="#333">25</text>
<line x1="550.0" y1="36" x2="550.0" y2="406" stroke="#e3e6ea"/><text x="550.0" y="424" text-anchor="middle" font-size="13" fill="#333">30</text>
<line x1="635.0" y1="36" x2="635.0" y2="406" stroke="#e3e6ea"/><text x="635.0" y="424" text-anchor="middle" font-size="13" fill="#333">35</text>
<line x1="720.0" y1="36" x2="720.0" y2="406" stroke="#e3e6ea"/><text x="720.0" y="424" text-anchor="middle" font-size="13" fill="#333">40</text>
<text x="380.0" y="438" text-anchor="middle" font-size="14" fill="#111">věk (roky)</text><text x="40" y="22" font-size="13" fill="#666">Přibližná rozmezí; jedinci se liší, proto se věk odhaduje z více znaků najednou.</text>
<rect x="40.0" y="60" width="6.0" height="12" rx="3" fill="#1a6d97"/>
<text x="40.0" y="55" text-anchor="start" font-size="14" fill="#111"><tspan font-weight="600">malý (zadní) lupínek zarůstá</tspan> <tspan fill="#555" font-size="12.5">· do 2–3 měsíců</tspan></text>
<rect x="57.0" y="98" width="17.0" height="12" rx="3" fill="#1a6d97"/>
<text x="57.0" y="93" text-anchor="start" font-size="14" fill="#111"><tspan font-weight="600">velký (čelní) lupínek zarůstá</tspan> <tspan fill="#555" font-size="12.5">· asi 18–24 měsíců</tspan></text>
<rect x="48.5" y="136" width="34.0" height="12" rx="3" fill="#1a6d97"/>
<text x="48.5" y="131" text-anchor="start" font-size="14" fill="#111"><tspan font-weight="600">prořezávání mléčného chrupu (20 zubů)</tspan> <tspan fill="#555" font-size="12.5">· 6 měsíců – 2,5 roku</tspan></text>
<rect x="43.4" y="174" width="200.6" height="12" rx="3" fill="#1a6d97"/>
<text x="43.4" y="169" text-anchor="start" font-size="14" fill="#111"><tspan font-weight="600">zápěstní kůstky se postupně objevují na RTG</tspan> <tspan fill="#555" font-size="12.5">· od prvních měsíců do 8–12 let</tspan></text>
<rect x="142.0" y="212" width="119.0" height="12" rx="3" fill="#1a6d97"/>
<text x="142.0" y="207" text-anchor="start" font-size="14" fill="#111"><tspan font-weight="600">výměna chrupu za trvalý</tspan> <tspan fill="#555" font-size="12.5">· 6–13 let</tspan></text>
<rect x="261.0" y="250" width="136.0" height="12" rx="3" fill="#1a6d97"/>
<text x="261.0" y="245" text-anchor="start" font-size="14" fill="#111"><tspan font-weight="600">růstové chrupavky dlouhých kostí mizí</tspan> <tspan fill="#555" font-size="12.5">· asi 13–21 let (dívky dříve)</tspan></text>
<rect x="329.0" y="288" width="136.0" height="12" rx="3" fill="#1a6d97"/>
<text x="329.0" y="283" text-anchor="start" font-size="14" fill="#111"><tspan font-weight="600">třetí stoličky („osmičky“)</tspan> <tspan fill="#555" font-size="12.5">· 17–25 let, někdy vůbec</tspan></text>
<rect x="346.0" y="326" width="204.0" height="12" rx="3" fill="#1a6d97"/>
<text x="346.0" y="321" text-anchor="start" font-size="14" fill="#111"><tspan font-weight="600">vnitřní konec klíční kosti srůstá</tspan> <tspan fill="#555" font-size="12.5">· poslední, až do 25–30 let</tspan></text>
<rect x="465.0" y="364" width="255.0" height="12" rx="3" fill="#1a6d97"/>
<text x="720.0" y="359" text-anchor="end" font-size="14" fill="#111"><tspan font-weight="600">lebeční švy zarůstají</tspan> <tspan fill="#555" font-size="12.5">· od 25–30 let dál, velmi proměnlivě →</tspan></text>
</svg>