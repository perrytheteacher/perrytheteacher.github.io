<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Sloupcový graf intermembrálního indexu: člověk asi 70, šimpanz 106, gorila 116, gibon asi 130, orangutan 139" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="760" height="330" fill="#fff"/>
<line x1="130.0" y1="30" x2="130.0" y2="270" stroke="#e3e6ea" /><text x="130.0" y="290" text-anchor="middle" font-size="14" fill="#333">0</text>
<line x1="310.0" y1="30" x2="310.0" y2="270" stroke="#e3e6ea" /><text x="310.0" y="290" text-anchor="middle" font-size="14" fill="#333">50</text>
<line x1="490.0" y1="30" x2="490.0" y2="270" stroke="#333" stroke-dasharray="6 4"/><text x="490.0" y="290" text-anchor="middle" font-size="14" fill="#333">100</text>
<line x1="670.0" y1="30" x2="670.0" y2="270" stroke="#e3e6ea" /><text x="670.0" y="290" text-anchor="middle" font-size="14" fill="#333">150</text>
<text x="490.0" y="22" text-anchor="middle" font-size="13" fill="#333">100 = končetiny stejně dlouhé</text>
<text x="120" y="63" text-anchor="end" font-size="16" fill="#111">člověk</text><rect x="130" y="42" width="252.0" height="30" fill="#c0392b" rx="3"/><text x="374.0" y="63" text-anchor="end" font-size="15" fill="#fff" font-weight="600">≈ 70</text>
<text x="138" y="84" font-size="12" fill="#555">vzpřímená chůze po dvou</text>
<text x="120" y="109" text-anchor="end" font-size="16" fill="#111">šimpanz</text><rect x="130" y="88" width="381.6" height="30" fill="#1a6d97" rx="3"/><text x="503.6" y="109" text-anchor="end" font-size="15" fill="#fff" font-weight="600">106</text>
<text x="138" y="130" font-size="12" fill="#555">šplh + chůze po kloubech prstů</text>
<text x="120" y="155" text-anchor="end" font-size="16" fill="#111">gorila</text><rect x="130" y="134" width="417.6" height="30" fill="#1a6d97" rx="3"/><text x="539.6" y="155" text-anchor="end" font-size="15" fill="#fff" font-weight="600">116</text>
<text x="138" y="176" font-size="12" fill="#555">chůze po kloubech prstů, šplh</text>
<text x="120" y="201" text-anchor="end" font-size="16" fill="#111">gibon</text><rect x="130" y="180" width="468.0" height="30" fill="#1a6d97" rx="3"/><text x="590.0" y="201" text-anchor="end" font-size="15" fill="#fff" font-weight="600">≈ 130</text>
<text x="138" y="222" font-size="12" fill="#555">brachiace (ručkování)</text>
<text x="120" y="247" text-anchor="end" font-size="16" fill="#111">orangutan</text><rect x="130" y="226" width="500.40000000000003" height="30" fill="#1a6d97" rx="3"/><text x="622.4000000000001" y="247" text-anchor="end" font-size="15" fill="#fff" font-weight="600">139</text>
<text x="138" y="268" font-size="12" fill="#555">šplh a závěs v korunách</text>
<text x="380.0" y="318" text-anchor="middle" font-size="13" fill="#666">intermembrální index = (pažní + vřetenní kost) / (stehenní + holenní kost) × 100; orientační průměry z literatury</text></svg>