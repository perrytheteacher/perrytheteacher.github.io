<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Vývojový diagram rozlišení karboxylové kyseliny, fenolu a alkoholu pomocí NaHCO3 a FeCl3" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="880" height="470" fill="#fff"/>
<text x="440.0" y="26" font-size="17" text-anchor="middle" font-weight="bold" fill="#222" >Jak rozlišit karboxylovou kyselinu, fenol a alkohol</text>
<rect x="300" y="45" width="280" height="50" rx="10" fill="#f4f6f7" stroke="#555" stroke-width="1.5"/>
<text x="440.0" y="65.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#222" >vzorek se skupinou –OH</text>
<text x="440.0" y="84.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >(vodný roztok)</text>
<rect x="280" y="125" width="320" height="50" rx="10" fill="#fef5e7" stroke="#b9770e" stroke-width="1.5"/>
<text x="440.0" y="155.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >1) přidej roztok NaHCO₃</text>
<line x1="440" y1="95" x2="440.0" y2="113.0" stroke="#333" stroke-width="2"/>
<polygon points="440,125 446.0,113.0 434.0,113.0" fill="#333"/>
<rect x="640" y="125" width="210" height="60" rx="10" fill="#fdebd0" stroke="#a04000" stroke-width="1.5"/>
<text x="745.0" y="150.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >šumí – uniká CO₂</text>
<text x="745.0" y="169.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >→ karboxylová kyselina</text>
<line x1="600" y1="150" x2="628.0149719334659" y2="151.40074859667328" stroke="#333" stroke-width="2"/>
<polygon points="640,152 628.3,145.4 627.7,157.4" fill="#333"/>
<text x="620" y="140" font-size="14" text-anchor="middle" font-weight="bold" fill="#333" >ano</text>
<rect x="280" y="230" width="320" height="50" rx="10" fill="#fef5e7" stroke="#b9770e" stroke-width="1.5"/>
<text x="440.0" y="260.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >2) přidej kapku roztoku FeCl₃</text>
<line x1="440" y1="175" x2="440.0" y2="218.0" stroke="#333" stroke-width="2"/>
<polygon points="440,230 446.0,218.0 434.0,218.0" fill="#333"/>
<text x="458" y="208" font-size="14" text-anchor="middle" font-weight="bold" fill="#333" >ne</text>
<rect x="640" y="225" width="210" height="70" rx="10" fill="#f4ecf7" stroke="#7d3c98" stroke-width="1.5"/>
<text x="745.0" y="246.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >fialové / modré / zelené</text>
<text x="745.0" y="265.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >zbarvení</text>
<text x="745.0" y="284.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >→ fenol</text>
<line x1="600" y1="255" x2="628.0336082813385" y2="257.1025206211004" stroke="#333" stroke-width="2"/>
<polygon points="640,258 628.5,251.1 627.6,263.1" fill="#333"/>
<text x="620" y="245" font-size="14" text-anchor="middle" font-weight="bold" fill="#333" >ano</text>
<rect x="280" y="335" width="320" height="50" rx="10" fill="#f4f6f7" stroke="#555" stroke-width="1.5"/>
<text x="440.0" y="365.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >zůstane žlutá barva FeCl₃</text>
<line x1="440" y1="280" x2="440.0" y2="323.0" stroke="#333" stroke-width="2"/>
<polygon points="440,335 446.0,323.0 434.0,323.0" fill="#333"/>
<text x="458" y="312" font-size="14" text-anchor="middle" font-weight="bold" fill="#333" >ne</text>
<rect x="640" y="330" width="210" height="60" rx="10" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.5"/>
<text x="745.0" y="355.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >→ alkohol</text>
<text x="745.0" y="374.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >(potvrdí např. reakce s Na)</text>
<line x1="600" y1="360" x2="628.0" y2="360.0" stroke="#333" stroke-width="2"/>
<polygon points="640,360 628.0,354.0 628.0,366.0" fill="#333"/>
<rect x="30" y="125" width="220" height="265" rx="10" fill="#fbfcfc" stroke="#aaa" stroke-width="1.5"/>
<text x="140.0" y="177.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#222" >Doplňkové testy</text>
<text x="140.0" y="196.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" ></text>
<text x="140.0" y="215.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >fenol × alkohol:</text>
<text x="140.0" y="234.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >fenol se rozpustí v NaOH</text>
<text x="140.0" y="253.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >(vznikne fenolát),</text>
<text x="140.0" y="272.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >alkohol nereaguje</text>
<text x="140.0" y="291.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" ></text>
<text x="140.0" y="310.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >bromová voda:</text>
<text x="140.0" y="329.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >fenol → bílá sraženina</text>
<text x="140.0" y="348.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#222" >2,4,6-tribromfenolu</text>
<text x="440.0" y="456" font-size="12" text-anchor="middle" font-weight="normal" fill="#666" >Platí pro jednoduché látky. Fe³⁺ dávají i některé enoly; kyselina salicylová má COOH i fenolové –OH, takže reaguje v obou krocích.</text>
</svg>
