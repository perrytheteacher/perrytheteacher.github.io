<text x="129.2" y="248" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >Ch. Gerhardt zavádí</text>
<text x="129.2" y="263" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >název fenol</text>
<circle cx="204.0" cy="200" r="6" fill="#c0392b"/>
