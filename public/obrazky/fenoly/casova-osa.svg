<text x="331.6" y="358" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >Lysol – dezinfekce</text>
<text x="331.6" y="373" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >z kresolů a mýdla</text>
<circle cx="366.8" cy="200" r="6" fill="#c0392b"/>
<line x1="366.8" y1="200" x2="366.8" y2="172" stroke="#c0392b" stroke-width="1.2"/>
<text x="366.8" y="142" font-size="14" text-anchor="middle" font-weight="bold" fill="#c0392b" >1897</text>
<text x="366.8" y="159" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >F. Hoffmann (Bayer):</text>
<text x="366.8" y="174" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >kyselina acetylsalicylová</text>
<circle cx="410.79999999999995" cy="200" r="6" fill="#c0392b"/>
<line x1="410.79999999999995" y1="200" x2="410.79999999999995" y2="215" stroke="#c0392b" stroke-width="1.2"/>
<text x="410.79999999999995" y="231" font-size="14" text-anchor="middle" font-weight="bold" fill="#c0392b" >1907</text>
<text x="410.79999999999995" y="248" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >L. Baekeland: bakelit –</text>
<text x="410.79999999999995" y="263" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >první plně syntetický plast</text>
<circle cx="573.6" cy="200" r="6" fill="#c0392b"/>
<line x1="573.6" y1="200" x2="573.6" y2="117" stroke="#c0392b" stroke-width="1.2"/>
<text x="573.6" y="87" font-size="14" text-anchor="middle" font-weight="bold" fill="#c0392b" >1944</text>
<text x="573.6" y="104" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >H. Hock: kumenový</text>
<text x="573.6" y="119" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >proces – fenol + aceton</text>
<circle cx="868.4000000000001" cy="200" r="6" fill="#c0392b"/>
<line x1="868.4000000000001" y1="200" x2="868.4000000000001" y2="270" stroke="#c0392b" stroke-width="1.2"/>
<text x="868.4000000000001" y="286" font-size="14" text-anchor="middle" font-weight="bold" fill="#c0392b" >2011</text>
<text x="868.4000000000001" y="303" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >EU zakazuje bisfenol A</text>
<text x="868.4000000000001" y="318" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >v kojeneckých lahvích</text>
</svg>
