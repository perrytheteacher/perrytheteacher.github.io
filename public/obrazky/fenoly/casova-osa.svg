<text x="89.6" y="159" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >F. F. Runge izoluje z černouhelného</text>
<text x="89.6" y="174" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >dehtu „karbolovou kyselinu“</text>
<circle cx="129.2" cy="200" r="6" fill="#c0392b"/>
