<text x="226.0" y="303" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >J. Lister: první operace</text>
<text x="226.0" y="318" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >s karbolovou kyselinou</text>
<circle cx="287.6" cy="200" r="6" fill="#c0392b"/>
