<text x="204.0" y="87" font-size="14" text-anchor="middle" font-weight="bold" fill="#c0392b" >1860</text>
<text x="204.0" y="104" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >H. Kolbe: syntéza kyseliny</text>
<text x="204.0" y="119" font-size="12" text-anchor="middle" font-weight="normal" fill="#222" >salicylové z fenolátu</text>
<circle cx="226.0" cy="200" r="6" fill="#c0392b"/>
