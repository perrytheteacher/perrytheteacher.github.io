<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" width="960" height="425" role="img" aria-label="Tři kroky trvalé ondulace: disulfidové můstky mezi řetězci keratinu se redukcí rozštěpí na skupiny SH a oxidací vzniknou znovu v novém tvaru vlasu." font-family="system-ui,Segoe UI,Arial,sans-serif"><rect width="960" height="425" fill="#fff"/><text x="20" y="30" font-size="18" text-anchor="start" font-weight="700" fill="#111">Disulfidové můstky drží tvar vlasu (keratin) – princip trvalé ondulace</text><text x="160" y="70" font-size="17" text-anchor="middle" font-weight="700" fill="#111">1 · rovný vlas</text><text x="160" y="360" font-size="14" text-anchor="middle" font-weight="400" fill="#4b5563">můstky S–S spojují</text><text x="160" y="380" font-size="14" text-anchor="middle" font-weight="400" fill="#4b5563">sousední řetězce keratinu</text><text x="480" y="70" font-size="17" text-anchor="middle" font-weight="700" fill="#111">2 · redukce</text><text x="480" y="360" font-size="14" text-anchor="middle" font-weight="400" fill="#4b5563">thioglykolát rozštěpí můstky:</text><text x="480" y="380" font-size="14" text-anchor="middle" font-weight="400" fill="#4b5563">S–S → 2 SH, vlas se natvaruje</text><text x="800" y="70" font-size="17" text-anchor="middle" font-weight="700" fill="#111">3 · oxidace</text><text x="800" y="360" font-size="14" text-anchor="middle" font-weight="400" fill="#4b5563">H₂O₂ vytvoří nové můstky</text><text x="800" y="380" font-size="14" text-anchor="middle" font-weight="400" fill="#4b5563">v novém tvaru – vlas drží vlnu</text><line x1="120" y1="95" x2="120" y2="330" stroke="#6b7280" stroke-width="10" stroke-linecap="round"/><line x1="200" y1="95" x2="200" y2="330" stroke="#6b7280" stroke-width="10" stroke-linecap="round"/><line x1="126" y1="140" x2="194" y2="140" stroke="#b45309" stroke-width="4"/><text x="142" y="134" font-size="14" text-anchor="middle" font-weight="700" fill="#b45309">S</text><text x="178" y="134" font-size="14" text-anchor