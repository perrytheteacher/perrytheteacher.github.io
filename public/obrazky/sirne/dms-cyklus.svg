<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-label="Schéma: fytoplankton tvoří DMSP, z něj vzniká dimethylsulfid, ten se odpaří, v ovzduší oxiduje na oxid siřičitý a kyselinu methansulfonovou, vzniká síranový aerosol, kondenzační jádra a mraky, které odrážejí sluneční záření." font-family="system-ui,Segoe UI,Arial,sans-serif"><rect width="980" height="520" fill="#fff"/><text x="20" y="30" font-size="19" text-anchor="start" font-weight="700" fill="#111">Dimethylsulfid: z oceánu do mraků</text><rect x="0" y="380" width="980" height="140" fill="#dbeafe"/><line x1="0" y1="380" x2="980" y2="380" stroke="#1d4ed8" stroke-width="2"/><text x="966" y="402" font-size="14" text-anchor="end" font-weight="700" fill="#1d4ed8">oceán</text><rect x="40" y="420" width="200" height="56" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="140.0" y="445.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">fytoplankton</text><text x="140.0" y="464.0" font-size="13" text-anchor="middle" font-weight="400" fill="#4b5563">tvoří DMSP (osmolyt)</text><rect x="320" y="420" width="210" height="56" rx="10" fill="#fff" stroke="#9ca3af" stroke-width="1.6"/><text x="425.0" y="445.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">DMSP → DMS</text><text x="425.0" y="464.0" font-size="13" text-anchor="middle" font-weight="400" fill="#4b5563">štěpí ho enzymy, bakterie</text><line x1="240" y1="448" x2="306.0" y2="448.0" stroke="#111" stroke-width="2.6"/><polygon points="318.0,448.0 306.0,442.0 306.0,454.0" fill="#111"/><rect x="320" y="250" width="210" height="56" rx="10" fill="#fff" stroke="#9ca3af" stroke-width="1.6"/><text x="425.0" y="275.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">DMS ve vzduchu</text><text x="425.0" y="294.0" font-size="13" text-anchor="middle" font-weight="400" fill="#4b5563">CH₃–S–CH₃, „vůně moře“</text><line x1="425" y1="418" x2="425.0" y2="320.0" stroke="#111" stroke-width="2.6"/><polygon points="425.0,308.0 419.0,320.0 431.0,320.0" fill="#111"/><text x="460" y="372" font-size="13" text-anchor="middle" font-weight="400" fill="#4b5563">odpar</text><rect x="600" y="250" width="200" height="56" rx="10" fill="#fff" stroke="#9ca3af" stroke-width="1.6"/><text x="700.0" y="275.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">oxidace radikály ·OH</text><text x="700.0" y="294.0" font-size="13" text-anchor="middle" font-weight="400" fill="#4b5563">→ SO₂, CH₃SO₃H</text><line x1="530" y1="278" x2="586.0" y2="278.0" stroke="#111" stroke-width="2.6"/><polygon points="598.0,278.0 586.0,272.0 586.0,284.0" fill="#111"/><rect x="600" y="120" width="200" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="700.0" y="145.0" font-size="15" text-anchor="middle" font-weight="700" fill="#111">síranový aerosol</text><text x="700.0" y="164.0" font-size="13" text-anchor="middle" font-weight="400" fill="#4b5563">kondenzační jádra</text><line x1="700" y1="248" x2="700.0" y2="190.0" stroke="#111" stroke-width="2.6"/><polygon points="700.0,178.0 694.0,190.0 706.0,190.0" fill="#111"/><circle cx="860" cy="80" r="34" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><circle cx="900" cy="70" r="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><circle cx="940" cy="88" r="30" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><circle cx="880" cy="100" r="30" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><circle cx="920" cy="104" r="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="900" y="96" font-size="15" text-anchor="middle" font-weight="700" fill="#111">mrak</text><line x1="800" y1="148" x2="841.8" y2="122.3" stroke="#111" stroke-width="2.6"/><polygon points="852.0,116.0 838.6,117.2 844.9,127.4" fill="#111"/><text x="900" y="150" font-size="13" text-anchor="middle" font-weight="400" fill="#4b5563">víc kapiček →</text><text x="900" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#4b5563">vyšší odrazivost</text><circle cx="80" cy="110" r="30" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="80" y="115" font-size="12" text-anchor="middle" font-weight="700" fill="#111">Slunce</text><line x1="112" y1="100" x2="828.0" y2="60.7" stroke="#d97706" stroke-width="2.6" stroke-dasharray="6 5"/><polygon points="840.0,60.0 827.7,54.7 828.3,66.6" fill="#d97706"/><text x="470" y="64" font-size="13" text-anchor="middle" font-weight="400" fill="#b45309">část záření se od mraků odrazí zpět do vesmíru</text><polyline points="950,180 950,340 140,340 140,405" fill="none" stroke="#047857" stroke-width="2.6" stroke-dasharray="6 5"/><polygon points="140,418 132,402 148,402" fill="#047857"/><text x="690" y="332" font-size="13" text-anchor="middle" font-weight="700" fill="#047857">zpětná vazba? (hypotéza CLAW, 1987 – dnes sporná)</text><text x="970" y="514" font-size="11.5" text-anchor="end" font-weight="400" fill="#4b5563" font-style="italic">kvalitativní schéma, ne měřítko · podle Charlson et al., Nature 326 (1987); Quinn &amp; Bates, Nature 480 (2011)</text></svg>