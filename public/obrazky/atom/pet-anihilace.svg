<text x="512.0" y="357.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="normal" >současně → přeměna leží na spojnici</text>
<text x="490.0" y="398.0" font-size="18" text-anchor="start" fill="#5b6370" font-weight="bold" >5  Rekonstrukce</text>
<text x="512.0" y="423.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="normal" >z mnoha spojnic (čárkovaně) počítač</text>
<text x="512.0" y="445.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="normal" >určí, kde se radiofarmakum hromadí</text>
<text x="956.0" y="488.0" font-size="13" text-anchor="end" fill="#5b6370" font-weight="normal" >Schéma, ne měřítko: dráha pozitronu je ve skutečnosti asi 1 mm.</text>
