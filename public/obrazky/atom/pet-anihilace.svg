<text x="490.0" y="90.0" font-size="18" text-anchor="start" fill="#1d4ed8" font-weight="bold" >1  Přeměna β⁺</text>
<text x="512.0" y="115.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="normal" >¹⁸F → ¹⁸O + e⁺ + νₑ (T₁/₂ ≈ 110 min)</text>
