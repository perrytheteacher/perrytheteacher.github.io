<text x="512.0" y="269.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="normal" >opačnými směry (zachování hybnosti)</text>
<text x="490.0" y="310.0" font-size="18" text-anchor="start" fill="#c2410c" font-weight="bold" >4  Koincidence</text>
