<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="Cesta radonu z horniny do plic: radium v hornině se mění na plynný radon, ten proniká do domu, jeho kovové produkty ulpí na prachu a po vdechnutí vyzařují alfa přímo do buněk dýchacích cest" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="context-stroke"/></marker></defs>
<rect width="980" height="560" fill="#fff"/>
<text x="490.0" y="34.0" font-size="21" text-anchor="middle" fill="#1f2328" font-weight="bold" >Proč je radon nebezpečný, i když ho vydechneme</text>
<rect x="30" y="62" width="430" height="168" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="48.0" y="96.0" font-size="19" text-anchor="start" fill="#1f2328" font-weight="bold" >1  Hornina pod domem</text>
<text x="48.0" y="134.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="normal" >²³⁸U → … → ²²⁶Ra → ²²²Rn + α</text>
<text x="48.0" y="164.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="normal" >Pevné prvky (U, Ra) zůstávají vázané</text>
<text x="48.0" y="194.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="normal" >v minerálech horniny.</text>
<rect x="520" y="62" width="430" height="168" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="538.0" y="96.0" font-size="19" text-anchor="start" fill="#1f2328" font-weight="bold" >2  Půdní vzduch</text>
<text x="538.0" y="134.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="normal" >²²²Rn je vzácný plyn: nevstoupí</text>
<text x="538.0" y="164.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="normal" >do sloučenin a prostupuje půdou</text>
<text x="538.0" y="194.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="normal" >a trhlinami v základech do domu.</text>
<rect x="520" y="278" width="430" height="168" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="538.0" y="312.0" font-size="19" text-anchor="start" fill="#1f2328" font-weight="bold" >3  Vzduch v místnosti</text>
<text x="538.0" y="350.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="normal" >²²²Rn → ²¹⁸Po + α  (T₁/₂ = 3,8 dne)</text>
<text x="538.0" y="380.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="normal" >²¹⁸Po, ²¹⁴Pb, ²¹⁴Bi, ²¹⁴Po jsou kovy:</text>
<text x="538.0" y="410.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="normal" >ulpí na prachu a kapénkách.</text>
<rect x="30" y="278" width="430" height="168" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="48.0" y="312.0" font-size="19" text-anchor="start" fill="#1f2328" font-weight="bold" >4  Dýchací cesty</text>
<text x="48.0" y="350.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="normal" >Vdechnuté částice se usadí.</text>
<text x="48.0" y="380.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="normal" >²¹⁸Po a ²¹⁴Po vyzáří α přímo do buněk;</text>
<text x="48.0" y="410.0" font-size="17" text-anchor="start" fill="#1f2328" font-weight="normal" >dosah α ve tkáni: setiny milimetru.</text>
<line x1="464.0" y1="146.0" x2="515.0" y2="146.0" stroke="#1f2328" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="735.0" y1="234.0" x2="735.0" y2="273.0" stroke="#1f2328" stroke-width="2.2" marker-end="url(#ar)"/>
<line x1="516.0" y1="362.0" x2="465.0" y2="362.0" stroke="#1f2328" stroke-width="2.2" marker-end="url(#ar)"/>
<rect x="30" y="470" width="920" height="66" rx="8" fill="#f6f8fa" stroke="#ccc"/>
<text x="48.0" y="497.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="normal" >Radon sám: plyn, většinu ho vydechneme dřív, než se přemění.</text>
<text x="48.0" y="522.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="normal" >Produkty: krátké poločasy (²¹⁸Po 3,1 min, ²¹⁴Po 0,16 ms) → přemění se v plicích.</text>
<text x="950.0" y="554.0" font-size="12.5" text-anchor="end" fill="#5b6370" font-weight="normal" >Schéma, ne měřítko. Poločasy: NUBASE 2020.</text>
</svg>