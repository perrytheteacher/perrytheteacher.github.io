<text x="590.0" y="214.0" font-size="15" text-anchor="start" fill="#1f2328" font-weight="bold" >asi 14,1 MeV</text>
<rect x="730.0" y="120.0" width="220.0" height="80.0" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" />
<text x="840.0" y="152.0" font-size="17" text-anchor="middle" fill="#c2410c" font-weight="bold" >celkem asi 17,6 MeV</text>
<text x="840.0" y="176.0" font-size="13" text-anchor="middle" fill="#c2410c" font-weight="normal" >na jednu reakci</text>
<text x="490.0" y="272.0" font-size="14" text-anchor="middle" fill="#1f2328" font-weight="normal" >Kontrola: A: 2 + 3 = 4 + 1;  Z: 1 + 1 = 2 + 0. Lehčí neutron odnese větší část kinetické energie.</text>
<text x="490.0" y="300.0" font-size="12" text-anchor="middle" fill="#5b6370" font-weight="normal" >Schéma, ne v měřítku. Neutrony mohou aktivovat materiály zařízení – fúze neznamená automaticky „žádná radioaktivita“.</text>
