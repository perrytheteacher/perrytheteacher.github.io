<text x="502.0" y="114.9" font-size="13.0" text-anchor="middle" fill="#fff" font-weight="bold" >n</text>
<circle cx="480.0" cy="132.0" r="13.0" fill="url(#gn)" stroke="#333" stroke-width="0.8" />
