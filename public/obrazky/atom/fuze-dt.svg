<text x="242.0" y="154.9" font-size="13.0" text-anchor="middle" fill="#fff" font-weight="bold" >n</text>
<circle cx="222.0" cy="162.0" r="13.0" fill="url(#gn)" stroke="#333" stroke-width="0.8" />
<text x="222.0" y="166.9" font-size="13.0" text-anchor="middle" fill="#fff" font-weight="bold" >n</text>
<text x="219.0" y="196.6" font-size="12.4" text-anchor="end" fill="#1f2328">3</text>
<text x="219.0" y="209.4" font-size="12.4" text-anchor="end" fill="#1f2328">1</text>
