<text x="232.0" y="228.0" font-size="13" text-anchor="middle" fill="#5b6370" font-weight="normal" >tritium (radioaktivní)</text>
<line x1="300.0" y1="150.0" x2="420.0" y2="150.0" stroke="#1f2328" stroke-width="2.5" marker-end="url(#ar)" />
<text x="360.0" y="132.0" font-size="12" text-anchor="middle" fill="#5b6370" font-weight="normal" >vysoká teplota,</text>
<text x="360.0" y="176.0" font-size="12" text-anchor="middle" fill="#5b6370" font-weight="normal" >hustota, doba udržení</text>
<circle cx="480.0" cy="110.0" r="13.0" fill="url(#gp)" stroke="#333" stroke-width="0.8" />
