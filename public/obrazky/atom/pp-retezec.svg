<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Proton–protonový řetězec ve Slunci: dvakrát spojení dvou protonů na deuterium, pak helium 3 a nakonec helium 4"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="820" height="330" fill="#fff"/><rect x="30" y="46" width="200" height="48" rx="8" fill="#fff" stroke="#1f2328"/><text x="130.0" y="67.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >p + p → ²H + e⁺ + ν</text><text x="130.0" y="86.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >slabá interakce – velmi pomalé</text><line x1="130.0" y1="96.0" x2="130.0" y2="136.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><rect x="30" y="138" width="200" height="48" rx="8" fill="#fff" stroke="#1f2328"/><text x="130.0" y="164.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >²H + p → ³He + γ</text><rect x="350" y="46" width="200" height="48" rx="8" fill="#fff" stroke="#1f2328"/><text x="450.0" y="67.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >p + p → ²H + e⁺ + ν</text><text x="450.0" y="86.0" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >slabá interakce – velmi pomalé</text><line x1="450.0" y1="96.0" x2="450.0" y2="136.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><rect x="350" y="138" width="200" height="48" rx="8" fill="#fff" stroke="#1f2328"/><text x="450.0" y="164.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >²H + p → ³He + γ</text><line x1="130.0" y1="188.0" x2="260.0" y2="238.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><line x1="450.0" y1="188.0" x2="330.0" y2="238.0" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><rect x="200" y="238" width="200" height="48" rx="8" fill="#fff" stroke="#1f2328"/><text x="300.0" y="264.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >³He + ³He → ⁴He + 2 p</text><rect x="600" y="40" width="205" height="250" rx="10" fill="#fff6dc" stroke="#e0782f"/><text x="615.0" y="66.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >Celkem:</text><text x="615.0" y="88.0" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >4 p → ⁴He + 2 e⁺ + 2 ν</text><text x="615.0" y="110.0" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >Q = 26,7 MeV</text><text x="615.0" y="132.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >(asi 2 % odnesou neutrina)</text><text x="615.0" y="154.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" ></text><text x="615.0" y="176.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >Proton v jádru Slunce</text><text x="615.0" y="198.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >čeká na první krok</text><text x="615.0" y="220.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >v průměru miliardy let –</text><text x="615.0" y="242.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >proto Slunce svítí</text><text x="615.0" y="264.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >asi 10 miliard let.</text><text x="300.0" y="22.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >Proton–protonový řetězec (hlavní větev pp I)</text></svg>