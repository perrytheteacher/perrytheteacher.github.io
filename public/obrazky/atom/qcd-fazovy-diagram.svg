<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-label="Fázový diagram kvarkové hmoty: teplota proti hustotě; vlevo dole hadronový plyn, nahoře kvark-gluonové plazma, hranice kolem 155 MeV, hypotetický kritický bod, běžná jádra, neutronové hvězdy, raný vesmír a srážky v LHC a RHIC"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="780" height="470" fill="#fff"/><rect x="90" y="60" width="620" height="340" fill="#fff"/><polygon fill="#fde3d0" points="90.0,60.0 90.0,234.2 128.8,236.4 167.5,240.6 206.2,248.1 245.0,259.8 245.0,259.8 303.1,283.1 361.2,309.7 400.0,330.9 438.8,352.2 458.1,368.1 469.8,384.1 477.5,400.0 710.0,400.0 710.0,60.0"/><polygon fill="#e3edf9" points="90.0,400.0 90.0,234.2 128.8,236.4 167.5,240.6 206.2,248.1 245.0,259.8 245.0,259.8 303.1,283.1 361.2,309.7 400.0,330.9 438.8,352.2 458.1,368.1 469.8,384.1 477.5,400.0"/><polyline fill="none" stroke="#c46a2a" stroke-width="3" stroke-dasharray="7 6" points="90.0,234.2 128.8,236.4 167.5,240.6 206.2,248.1 245.0,259.8"/><polyline fill="none" stroke="#c46a2a" stroke-width="3" points="245.0,259.8 303.1,283.1 361.2,309.7 400.0,330.9 438.8,352.2 458.1,368.1 469.8,384.1 477.5,400.0"/><circle cx="245.0" cy="259.8" r="8" fill="#fff" stroke="#d64545" stroke-width="3"/><text x="259.0" y="229.8" text-anchor="start" font-size="13" font-weight="700" fill="#d64545" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >kritický bod?</text><text x="259.0" y="245.8" text-anchor="start" font-size="11.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >(hledá se, poloha nejistá)</text><line x1="86" x2="90" y1="400.0" y2="400.0" stroke="#5b6370"/><text x="82.0" y="404.0" text-anchor="end" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >0</text><line x1="86" x2="90" y1="346.9" y2="346.9" stroke="#5b6370"/><text x="82.0" y="350.9" text-anchor="end" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >50</text><line x1="86" x2="90" y1="293.8" y2="293.8" stroke="#5b6370"/><text x="82.0" y="297.8" text-anchor="end" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >100</text><line x1="86" x2="90" y1="240.6" y2="240.6" stroke="#5b6370"/><text x="82.0" y="244.6" text-anchor="end" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >150</text><line x1="86" x2="90" y1="187.5" y2="187.5" stroke="#5b6370"/><text x="82.0" y="191.5" text-anchor="end" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >200</text><line x1="86" x2="90" y1="134.4" y2="134.4" stroke="#5b6370"/><text x="82.0" y="138.4" text-anchor="end" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >250</text><line x1="86" x2="90" y1="81.2" y2="81.2" stroke="#5b6370"/><text x="82.0" y="85.2" text-anchor="end" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >300</text><text x="90.0" y="418.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >0</text><text x="245.0" y="418.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >400</text><text x="400.0" y="418.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >800</text><text x="555.0" y="418.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >1200</text><text x="710.0" y="418.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >1600</text><line x1="90" x2="710" y1="400" y2="400" stroke="#9aa1aa"/><line x1="90" x2="90" y1="60" y2="400" stroke="#9aa1aa"/><text x="400.0" y="443.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >baryonový chemický potenciál μ<tspan font-size='70%' baseline-shift='sub'>B</tspan> (MeV) → rostoucí hustota hmoty</text><text x="30.0" y="230.0" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" transform="rotate(-90 30 230)">teplota T (MeV)</text><line x1="90" x2="710" y1="234.2" y2="234.2" stroke="#5b6370" stroke-dasharray="2 4"/><text x="704.0" y="228.2" text-anchor="end" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >155 MeV ≈ 1,8·10¹² K</text><text x="400.0" y="134.4" text-anchor="middle" font-size="20" font-weight="700" fill="#b5541b" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >kvark-gluonové plazma</text><text x="400.0" y="156.4" text-anchor="middle" font-size="13.5" font-weight="400" fill="#b5541b" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >volné kvarky a gluony</text><text x="198.5" y="336.2" text-anchor="middle" font-size="18" font-weight="700" fill="#2f5f99" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >hadronový plyn</text><text x="198.5" y="356.2" text-anchor="middle" font-size="13" font-weight="400" fill="#2f5f99" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >kvarky uvězněné v hadronech</text><circle cx="447.3" cy="400.0" r="7" fill="#1f2328"/><text x="441.3" y="386.0" text-anchor="end" font-size="12.5" font-weight="400" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >běžná jádra</text><ellipse cx="593.8" cy="391.5" rx="80" ry="12" fill="#7b4fc4" fill-opacity=".25" stroke="#7b4fc4"/><text x="593.8" y="373.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7b4fc4" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >nitra neutronových hvězd</text><line x1="93.9" y1="70.6" x2="93.9" y2="219.4" stroke="#7a7a7a" stroke-width="2" marker-end="url(#ar)"/><text x="103.9" y="81.2" text-anchor="start" font-size="13" font-weight="700" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >raný vesmír</text><text x="103.9" y="98.2" text-anchor="start" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >(mikrosekundy po velkém třesku)</text><rect x="112.0" y="187.5" width="10" height="53.1" fill="#d64545" fill-opacity=".85"/><text x="128.0" y="191.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#d64545" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >LHC, RHIC (srážky těžkých jader)</text><text x="400.0" y="24.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >Fázový diagram silně interagující hmoty (kvalitativně)</text><text x="400.0" y="44.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >čárkovaně: plynulý přechod (crossover, mřížková QCD T ≈ 155 MeV); plnou čarou: předpokládaný fázový přechod</text></svg>