<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-label="Přehled částic: subatomární částice jsou menší než atom; proton a neutron jsou složené z kvarků, elementární částice (kvarky, leptony, foton, gluon) nemají zjištěnou vnitřní strukturu" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="context-stroke"/></marker><radialGradient id="gp" cx="35%" cy="35%"><stop offset="0" stop-color="#f3a09c"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gn" cx="35%" cy="35%"><stop offset="0" stop-color="#d5dbe1"/><stop offset="1" stop-color="#76838f"/></radialGradient><radialGradient id="ge" cx="35%" cy="35%"><stop offset="0" stop-color="#9cc3ee"/><stop offset="1" stop-color="#1f5f9e"/></radialGradient><radialGradient id="mrak"><stop offset="0" stop-color="#2b6cb0" stop-opacity=".55"/><stop offset=".45" stop-color="#2b6cb0" stop-opacity=".22"/><stop offset="1" stop-color="#2b6cb0" stop-opacity="0"/></radialGradient></defs>
<rect width="980" height="430" fill="#fff"/>
<text x="490.0" y="30.0" font-size="20" text-anchor="middle" fill="#1f2328" font-weight="bold" >Subatomární a elementární částice</text>
<rect x="290.0" y="50.0" width="400.0" height="56.0" rx="10" fill="#eef2f7" stroke="#4a5568" stroke-width="1.5" />
<text x="490.0" y="74.0" font-size="17" text-anchor="middle" fill="#1f2328" font-weight="bold" >subatomární částice</text>
<text x="490.0" y="94.0" font-size="14" text-anchor="middle" fill="#5b6370" font-weight="normal" >= částice menší než atom</text>
<line x1="420.0" y1="106.0" x2="240.0" y2="150.0" stroke="#5b6370" stroke-width="2" marker-end="url(#ar)" />
<line x1="560.0" y1="106.0" x2="740.0" y2="150.0" stroke="#5b6370" stroke-width="2" marker-end="url(#ar)" />
<rect x="40.0" y="152.0" width="400.0" height="190.0" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2" />
<text x="240.0" y="178.0" font-size="16" text-anchor="middle" fill="#9b2c22" font-weight="bold" >složené – mají vnitřní strukturu</text>
<circle cx="110.0" cy="232.0" r="24.0" fill="url(#gp)" stroke="#333" stroke-width="0.8" />
<text x="110.0" y="241.1" font-size="24.0" text-anchor="middle" fill="#fff" font-weight="bold" >p⁺</text>
<text x="150.0" y="226.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="bold" >proton</text>
<text x="150.0" y="246.0" font-size="14" text-anchor="start" fill="#5b6370" font-weight="normal" >valenční kvarky u u d</text>
<circle cx="110.0" cy="295.0" r="24.0" fill="url(#gn)" stroke="#333" stroke-width="0.8" />
<text x="110.0" y="304.1" font-size="24.0" text-anchor="middle" fill="#fff" font-weight="bold" >n</text>
<text x="150.0" y="289.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="bold" >neutron</text>
<text x="150.0" y="309.0" font-size="14" text-anchor="start" fill="#5b6370" font-weight="normal" >valenční kvarky u d d</text>
<text x="240.0" y="334.0" font-size="13" text-anchor="middle" fill="#9b2c22" font-weight="normal" font-style="italic">nejsou elementární</text>
<rect x="540.0" y="152.0" width="400.0" height="190.0" rx="10" fill="#fff" stroke="#2b6cb0" stroke-width="2" />
<text x="740.0" y="178.0" font-size="16" text-anchor="middle" fill="#1f4f80" font-weight="bold" >elementární – bez zjištěné struktury</text>
<text x="560.0" y="214.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="bold" >kvarky</text>
<text x="720.0" y="214.0" font-size="15" text-anchor="start" fill="#1f2328" font-weight="normal" >u, d (a další)</text>
<text x="560.0" y="254.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="bold" >leptony</text>
<text x="720.0" y="254.0" font-size="15" text-anchor="start" fill="#1f2328" font-weight="normal" >elektron e⁻, neutrina</text>
<text x="560.0" y="294.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="bold" >částice interakcí</text>
<text x="720.0" y="294.0" font-size="15" text-anchor="start" fill="#1f2328" font-weight="normal" >foton γ, gluon g</text>
<text x="740.0" y="334.0" font-size="13" text-anchor="middle" fill="#1f4f80" font-weight="normal" font-style="italic">elektron je subatomární i elementární</text>
<text x="490.0" y="378.0" font-size="14" text-anchor="middle" fill="#1f2328" font-weight="normal" >Proton a neutron jsou z kvarků a gluonového pole – proto jsou subatomární, ale ne elementární.</text>
<text x="490.0" y="402.0" font-size="13" text-anchor="middle" fill="#5b6370" font-weight="normal" >„Elementární“ znamená: podle současného poznání nemá zjištěnou vnitřní strukturu.</text>
</svg>