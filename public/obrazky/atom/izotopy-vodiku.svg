<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-label="Izotopy vodíku: lehký vodík 1H s jedním protonem, deuterium 2H s protonem a neutronem, radioaktivní tritium 3H s protonem a dvěma neutrony; každý atom má jeden elektron" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="context-stroke"/></marker><radialGradient id="gp" cx="35%" cy="35%"><stop offset="0" stop-color="#f3a09c"/><stop offset="1" stop-color="#c0392b"/></radialGradient><radialGradient id="gn" cx="35%" cy="35%"><stop offset="0" stop-color="#d5dbe1"/><stop offset="1" stop-color="#76838f"/></radialGradient><radialGradient id="ge" cx="35%" cy="35%"><stop offset="0" stop-color="#9cc3ee"/><stop offset="1" stop-color="#1f5f9e"/></radialGradient><radialGradient id="mrak"><stop offset="0" stop-color="#2b6cb0" stop-opacity=".55"/><stop offset=".45" stop-color="#2b6cb0" stop-opacity=".22"/><stop offset="1" stop-color="#2b6cb0" stop-opacity="0"/></radialGradient></defs>
<rect width="980" height="330" fill="#fff"/>
<text x="490.0" y="30.0" font-size="19" text-anchor="middle" fill="#1f2328" font-weight="bold" >Izotopy vodíku – stejné Z = 1, různý počet neutronů</text>
<text x="143.0" y="65.4" font-size="18.6" text-anchor="end" fill="#1f2328">1</text>
<text x="143.0" y="84.6" font-size="18.6" text-anchor="end" fill="#1f2328">1</text>
<text x="144.0" y="78.0" font-size="30" fill="#1f2328" font-weight="bold">H</text>
<text x="172.0" y="78.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="normal" >  lehký vodík (protium)</text>
<circle cx="170.0" cy="165.0" r="74.0" fill="url(#mrak)" stroke="#9cc3ee" stroke-width="1" stroke-dasharray="4 3" />
<circle cx="170.0" cy="165.0" r="14.0" fill="url(#gp)" stroke="#333" stroke-width="0.8" />
<text x="170.0" y="170.3" font-size="14.0" text-anchor="middle" fill="#fff" font-weight="bold" >p⁺</text>
<text x="220.0" y="107.0" font-size="15" text-anchor="start" fill="#2b6cb0" font-weight="bold" >e⁻</text>
<text x="170.0" y="265.0" font-size="16" text-anchor="middle" fill="#1f2328" font-weight="bold" >1 p⁺, 0 n, 1 e⁻</text>
<text x="170.0" y="287.0" font-size="14" text-anchor="middle" fill="#5b6370" font-weight="normal" >stabilní, 99,98 % přírodního H</text>
<text x="463.0" y="65.4" font-size="18.6" text-anchor="end" fill="#1f2328">2</text>
<text x="463.0" y="84.6" font-size="18.6" text-anchor="end" fill="#1f2328">1</text>
<text x="464.0" y="78.0" font-size="30" fill="#1f2328" font-weight="bold">H</text>
<text x="492.0" y="78.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="normal" >  deuterium</text>
<circle cx="490.0" cy="165.0" r="74.0" fill="url(#mrak)" stroke="#9cc3ee" stroke-width="1" stroke-dasharray="4 3" />
<circle cx="479.0" cy="165.0" r="14.0" fill="url(#gp)" stroke="#333" stroke-width="0.8" />
