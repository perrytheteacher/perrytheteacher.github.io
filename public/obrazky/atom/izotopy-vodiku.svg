<circle cx="501.0" cy="165.0" r="14.0" fill="url(#gn)" stroke="#333" stroke-width="0.8" />
<text x="501.0" y="170.3" font-size="14.0" text-anchor="middle" fill="#fff" font-weight="bold" >n</text>
<text x="540.0" y="107.0" font-size="15" text-anchor="start" fill="#2b6cb0" font-weight="bold" >e⁻</text>
<text x="490.0" y="265.0" font-size="16" text-anchor="middle" fill="#1f2328" font-weight="bold" >1 p⁺, 1 n, 1 e⁻</text>
<text x="490.0" y="287.0" font-size="14" text-anchor="middle" fill="#5b6370" font-weight="normal" >stabilní</text>
<text x="783.0" y="65.4" font-size="18.6" text-anchor="end" fill="#1f2328">3</text>
<text x="783.0" y="84.6" font-size="18.6" text-anchor="end" fill="#1f2328">1</text>
<text x="784.0" y="78.0" font-size="30" fill="#1f2328" font-weight="bold">H</text>
<text x="812.0" y="78.0" font-size="16" text-anchor="start" fill="#1f2328" font-weight="normal" >  tritium</text>
<circle cx="810.0" cy="165.0" r="74.0" fill="url(#mrak)" stroke="#9cc3ee" stroke-width="1" stroke-dasharray="4 3" />
<circle cx="799.0" cy="171.0" r="14.0" fill="url(#gp)" stroke="#333" stroke-width="0.8" />
<text x="799.0" y="176.3" font-size="14.0" text-anchor="middle" fill="#fff" font-weight="bold" >p⁺</text>
<circle cx="821.0" cy="156.0" r="14.0" fill="url(#gn)" stroke="#333" stroke-width="0.8" />
<text x="821.0" y="161.3" font-size="14.0" text-anchor="middle" fill="#fff" font-weight="bold" >n</text>
<circle cx="819.0" cy="179.0" r="14.0" fill="url(#gn)" stroke="#333" stroke-width="0.8" />
<text x="819.0" y="184.3" font-size="14.0" text-anchor="middle" fill="#fff" font-weight="bold" >n</text>
<text x="860.0" y="107.0" font-size="15" text-anchor="start" fill="#2b6cb0" font-weight="bold" >e⁻</text>
<text x="810.0" y="265.0" font-size="16" text-anchor="middle" fill="#1f2328" font-weight="bold" >1 p⁺, 2 n, 1 e⁻</text>
<text x="810.0" y="287.0" font-size="14" text-anchor="middle" fill="#9b2c22" font-weight="normal" >radioaktivní (β⁻)</text>
<text x="490.0" y="318.0" font-size="13" text-anchor="middle" fill="#5b6370" font-weight="normal" >Schéma složení: jádro je proti obalu obrovsky zvětšené, modrá oblast znázorňuje elektronový obal, ne dráhu elektronu.</text>
</svg>