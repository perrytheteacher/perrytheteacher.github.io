name: Publikovat web na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout soubory
        uses: actions/checkout@v7
        with:
          # celá historie – z ní se počítá sekce Novinky
          fetch-depth: 0
      - name: Připravit Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Nainstalovat a sestavit web
        run: |
          npm install
          npm run build
      - name: Vytvořit PDF prezentací
        run: |
          npx playwright install --with-deps chromium
          npm run pdf
      - name: Připravit web k publikování
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikovat
        id: deployment
        uses: actions/deploy-pages@v5
