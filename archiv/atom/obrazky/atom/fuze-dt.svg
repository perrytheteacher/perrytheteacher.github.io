<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Fúze deuteria a tritia na helium 4 s energií 3,5 MeV a neutron s energií 14,1 MeV"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="760" height="260" fill="#fff"/><circle cx="70" cy="110" r="8" fill="#d64545" stroke="#fff"/><circle cx="81" cy="110" r="8" fill="#8a96a3" stroke="#fff"/><text x="75.0" y="150.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >deuterium ²H</text><text x="150.0" y="116.0" text-anchor="middle" font-size="22" font-weight="400" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >+</text><circle cx="225" cy="110" r="8" fill="#d64545" stroke="#fff"/><circle cx="236" cy="110" r="8" fill="#8a96a3" stroke="#fff"/><circle cx="219" cy="119" r="8" fill="#8a96a3" stroke="#fff"/><text x="228.0" y="150.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >tritium ³H</text><line x1="285.0" y1="110.0" x2="360.0" y2="110.0" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><text x="322.0" y="95.0" text-anchor="middle" font-size="12" font-weight="400" fill="#e0782f" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >150 mil. °C</text><circle cx="430" cy="70" r="8" fill="#d64545" stroke="#fff"/><circle cx="441" cy="70" r="8" fill="#d64545" stroke="#fff"/><circle cx="424" cy="79" r="8" fill="#8a96a3" stroke="#fff"/><circle cx="435" cy="60" r="8" fill="#8a96a3" stroke="#fff"/><text x="500.0" y="75.0" text-anchor="start" font-size="15" font-weight="700" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >⁴He  3,5 MeV</text><text x="500.0" y="94.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >ohřívá plazma</text><circle cx="430" cy="170" r="8" fill="#8a96a3" stroke="#fff"/><text x="500.0" y="175.0" text-anchor="start" font-size="15" font-weight="700" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >n  14,1 MeV</text><text x="500.0" y="194.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >unese 80 % energie, poletí do stěny</text><text x="500.0" y="212.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >(ohřívá stěnu, z lithia vyrábí tritium)</text><text x="380.0" y="26.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >Fúze deuteria a tritia: Q = 17,6 MeV</text><text x="380.0" y="248.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >Hybnost se zachovává → lehčí neutron dostane 4× víc kinetické energie než ⁴He.</text></svg>