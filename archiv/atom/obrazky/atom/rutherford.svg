<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Pokus se zlatou fólií: většina částic alfa projde rovně, některé se odchýlí a výjimečně se odrazí zpět; proto má atom malé hmotné kladné jádro"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="800" height="360" fill="#fff"/><rect x="20" y="140" width="90" height="70" rx="6" fill="#d9dde2" stroke="#1f2328"/><text x="65.0" y="232.0" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >zdroj α</text><rect x="300" y="70" width="10" height="210" fill="#e8c34a" stroke="#a68420"/><text x="305.0" y="60.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >zlatá fólie</text><text x="305.0" y="300.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >tloušťka asi 400 nm</text><path d="M590 50 A 250 250 0 0 1 590 300" fill="none" stroke="#2f9e5b" stroke-width="6" stroke-opacity=".5"/><text x="668.0" y="180.0" text-anchor="start" font-size="13" font-weight="400" fill="#2f9e5b" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >stínítko ZnS</text><text x="668.0" y="198.0" text-anchor="start" font-size="12" font-weight="400" fill="#5b6370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" >(záblesky)</text><line x1="110.0" y1="147.0" x2="600.0" y2="145.6" stroke="#d64545" stroke-width="1.8" marker-end="url(#ar)"/><line x1="110.0" y1="161.0" x2="600.0" y2="160.3" stroke="#d64545" stroke-width="1.8" marker-end="url(#ar)"/><line x1="110.0" y1="175.0" x2="600.0" y2="175.0" stroke="#d64545" stroke-width="1.8" marker-end="url(#ar)"/><line x1="110.0" y1="189.0" x2="600.0" y2="189